[project]
name = "mind-inbox-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.52.1",
    "agent-framework>=1.13.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "azure-identity>=1.16.0",
    "azure-cosmos>=4.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    # docs/api/ai-agent.yaml の生成 (scripts/generate_openapi.py)。
    # 依存の依存として入ってはいるが、それに乗ると上流が外した瞬間に
    # 「CI の OpenAPI 再生成だけが落ちる」ので明示する。
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
