# apps/bff の pnpm 設定 (#420 で npm から移行)。
#
# packages: pnpm 9 はこのファイルがあると `packages` を要求する (無いと
#   「packages field missing or empty」で install が落ちる)。BFF は単独パッケージなので "." だけ。
#
# ビルドスクリプトの許可: pnpm 10 以降は依存の postinstall を既定で実行しない。
#   esbuild (vitest 経由) はネイティブバイナリを配置する postinstall を持ち、
#   これが走らないと pnpm 11 では install が ERR_PNPM_IGNORED_BUILDS で落ちる。
#   キー名がバージョンで変わったため両方置く — pnpm 10 = onlyBuiltDependencies /
#   pnpm 11 = allowBuilds。CI は pnpm 9 (どちらも読まず全ビルドを実行) で、
#   ローカル開発機は pnpm 11 が入っているため、片方だけだと「CI は緑なのに
#   手元で install できない」に分かれる。
packages:
  - "."

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
