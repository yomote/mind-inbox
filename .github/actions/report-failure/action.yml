name: report-failure
description: >
  落ちた workflow 自身が Issue を立て、直ったら自分で閉じる。
  見張り役 (cd-watchdog) を置かずに「黙っている = 落ちていない」を成立させるための部品。

# 判断の背景: ADR 0035 D2。
#   別の見張りを置くと「見張りが黙る」問題が残る (2026-08-10 に実際に起きた —
#   cd-watchdog は deploy / golden-path の赤 5 回に無反応だった)。
#   落ちた当人が喋るなら、沈黙そのものが「異常なし」を意味する。
#
# 冪等性: 同じ workflow の open な Issue が既にあれば **新規に立てず追記**する。
#   毎 run 立てると Issue が溢れて誰も見なくなる。
# 自己回復: 次に緑になったら同じ Issue にコメントして **close する**。
#   閉じ忘れた Issue が残ると、Issue 一覧が現在の状態を表さなくなる。

inputs:
  job-status:
    description: "呼び出し元の job.status をそのまま渡す (success / failure / cancelled)"
    required: true
  work-ran:
    description: >
      **監視対象の処理が実際に走ったか** ("true" / "false")。
      job が success でも、guard で skip された・別アクション (down) だった場合は
      「復旧した」と言えない。ここが true のときだけ Issue を閉じる。
    required: true
  what:
    description: "何が壊れたのかを 1 行で (Issue 本文の先頭に出る)"
    required: true
  github-token:
    description: "issues: write を持つトークン"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Issue を立てる / 閉じる
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        JOB_STATUS: ${{ inputs.job-status }}
        WORK_RAN: ${{ inputs.work-ran }}
        WHAT: ${{ inputs.what }}
        WF: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        REF: ${{ github.ref_name }}
      run: |
        set -uo pipefail

        # cancelled を「人が止めただけ」と決めつけない。deploy は timeout-minutes: 90、
        # golden-path は 45 — **タイムアウトも cancelled として現れる**。ハングした
        # デプロイやプローブは立派な障害なので、赤として扱う (Codex レビュー #214 の指摘)。
        # 人が止めた場合は次の緑で自動的に閉じるので、寄せる先は「報告する」側でよい。
        if [ "$JOB_STATUS" = "cancelled" ]; then
          echo "job は cancelled (タイムアウトの可能性がある) — 失敗として扱う"
          JOB_STATUS="failure"
        fi

        TITLE="[ci-failure] $WF が落ちている"
        gh label create ci-failure -R "$REPO" --color b60205 \
          --description "落ちた workflow 自身が立てた Issue (ADR 0035 D2)" 2>/dev/null || true

        # 既存の open Issue を探す。タイトル完全一致で引く (部分一致だと
        # 別 workflow の Issue に相乗りしてしまう)。
        EXISTING=$(gh issue list -R "$REPO" --label ci-failure --state open \
                     --json number,title --limit 100 \
                     --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty" 2>/dev/null)

        if [ "$JOB_STATUS" = "success" ]; then
          # **success = 復旧、ではない。** OIDC 未設定で guard に弾かれた、自動デプロイが
          # 止められていた、`down` を実行した — いずれも job は success だが監視対象の
          # 処理は 1 行も走っていない。ここで Issue を閉じると障害を隠す
          # (Codex レビュー #214 の指摘。見張りを廃止した今、これは致命的になる)。
          if [ "$WORK_RAN" != "true" ]; then
            echo "job は success だが監視対象の処理は走っていない (work-ran=$WORK_RAN)。Issue は触らない"
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" \
              --body "$(printf '✅ 復旧しました。\n\n- run: %s\n- commit: `%s` (%s)\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$RUN_URL" "$SHA" "$REF")" || true
            gh issue close "$EXISTING" -R "$REPO" --reason completed || true
            echo "復旧したので #$EXISTING を閉じた"
          else
            echo "緑。open な Issue も無いので何もしない"
          fi
          exit 0
        fi

        BODY=$(printf '%s\n\n| | |\n| --- | --- |\n| workflow | `%s` |\n| run | %s |\n| commit | `%s` |\n| ref | `%s` |\n\n**この Issue は落ちた workflow 自身が立てています** (ADR 0035 D2)。\n次に同じ workflow が緑になれば自動で閉じます。**手で閉じないでください** —\n閉じても直っていなければ、次の失敗でまた立ちます。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' \
          "$WHAT" "$WF" "$RUN_URL" "$SHA" "$REF")

        if [ -n "$EXISTING" ]; then
          gh issue comment "$EXISTING" -R "$REPO" \
            --body "$(printf '🔴 まだ落ちています。\n\n- run: %s\n- commit: `%s` (%s)\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$RUN_URL" "$SHA" "$REF")" || true
          echo "既存の #$EXISTING に追記した"
        else
          gh issue create -R "$REPO" --title "$TITLE" --label ci-failure --body "$BODY" || {
            # ここで黙って終わると「立てたつもり」になる。run を落として気づけるようにする。
            echo "::error::Issue を作成できなかった (permissions: issues: write を確認)"
            exit 1
          }
          echo "新規 Issue を立てた"
        fi
