name: report-failure
description: >
  落ちた workflow 自身が Issue を立て、直ったら自分で閉じる。
  見張り役 (cd-watchdog) を置かずに「黙っている = 落ちていない」を成立させるための部品。

# 判断の背景: ADR 0035 D2。
#   別の見張りを置くと「見張りが黙る」問題が残る (2026-08-10 に実際に起きた —
#   cd-watchdog は deploy / golden-path の赤 5 回に無反応だった)。
#   落ちた当人が喋るなら、沈黙そのものが「異常なし」を意味する。
#
# 冪等性: 同じ workflow の open な Issue が既にあれば **新規に立てず追記**する。
#   毎 run 立てると Issue が溢れて誰も見なくなる。
# 自己回復: 次に緑になったら同じ Issue にコメントして **close する**。
#   閉じ忘れた Issue が残ると、Issue 一覧が現在の状態を表さなくなる。
#
# 通報に失敗したときの扱い (Issue #507 の設計判断):
#   **「見せる」と「run を赤にする」を分ける。** 通報の失敗は job の成否によらず必ず
#   `::error::` 注釈 + step summary に出す (握り潰さない) が、**step を赤にするのは
#   呼び出し元の job が失敗側のときだけ**。job が成功しているのに通報の失敗で赤にすると、
#   run の色が「デプロイが届いたか」を答えなくなり、状況ページ・戦況図の一次判定を汚す
#   (2026-08-17 に実際に 3 run 連続で起きた)。判定の実体と根拠は
#   cicd/scripts/report-failure/notify_rules.py の step_verdict()。

inputs:
  job-status:
    description: "呼び出し元の job.status をそのまま渡す (success / failure / cancelled)"
    required: true
  cancelled-is-failure:
    description: >
      cancelled を障害として扱うか ("true" / "false")。
      **呼び出し元しか区別できない** — deploy / golden-path はタイムアウトが
      cancelled として現れるので "true"、status-page は concurrency の
      cancel-in-progress による自己中断が正常運用なので "false"。
    required: false
    default: "true"
  work-ran:
    description: >
      **監視対象の処理が実際に走ったか** ("true" / "false")。
      job が success でも、guard で skip された・別アクション (down) だった場合は
      「復旧した」と言えない。ここが true のときだけ Issue を閉じる。
    required: true
  what:
    description: "何が壊れたのかを 1 行で (Issue 本文の先頭に出る)"
    required: true
  github-token:
    description: "issues: write を持つトークン"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # 実体は cicd/scripts/report-failure/notify.py。**ここに判定を書き戻さないこと** —
    # 2026-08-17 の deploy 3 run は、この step がシェルのコマンド置換 + errexit で
    # **1 行も出力を残さず exit 1** し、成功したデプロイを 3 回続けて赤にした (#507)。
    # YAML の中の if / コマンド置換はテストできず、失敗しても痕跡が残らない
    # (cicd/CLAUDE.md「判定ロジックをシェルや workflow の中に埋めない」)。
    - name: Issue を立てる / 閉じる
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        JOB_STATUS: ${{ inputs.job-status }}
        WORK_RAN: ${{ inputs.work-ran }}
        CANCELLED_IS_FAILURE: ${{ inputs.cancelled-is-failure }}
        WHAT: ${{ inputs.what }}
        WF: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        REF: ${{ github.ref_name }}
      run: |
        set -uo pipefail
        python3 "$GITHUB_ACTION_PATH/../../../cicd/scripts/report-failure/notify.py"
