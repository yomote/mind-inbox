# 毎朝の UX 機械計測 (ADR 0037 / 旧 ux-judge Routine の機械部分)。
#
# 分担: LLM を Actions で走らせる経路は却下済み (API キー = 従量課金 / OAuth トークン =
#   長期クレデンシャル — ADR 0008/0009/0035 D5)。ここは**機械で計算できる計測だけ**を
#   毎朝積み、LLM 採点 (ux-judge-score) は PM セッションの日次 tick が subagent で行う。
#   Routine と違い、run 履歴が必ず残るので「沈黙 = 落ちていない」が成立する (ADR 0035 D1)。
#
# 流れ (蓄積は ADR 0041 のデータブランチ): data/ux-observations の probes/*.jsonl から
#   最新のプローブ記録 (golden-path-monitor が 07:00 JST に追記) を読み → 鮮度を確認
#   (26h 以内に記録が無ければ run を赤にする — 古い記録を「今日の計測」として積まない)
#   → 機械計測を抽出して同ブランチの evals/*.jsonl に 1 run = 1 行
#   (kind: "ux-eval-mech") で追記する。
name: ux-eval

on:
  schedule:
    - cron: "20 23 * * *" # 08:20 JST 毎朝 (07:00 JST の golden-path-monitor が終わってから)
  workflow_dispatch:

permissions:
  contents: write # データブランチ data/ux-observations へ追記する (ADR 0041)
  issues: write # 失敗時の自己通報 (report-failure)

env:
  UX_DATA_BRANCH: data/ux-observations # 蓄積の置き場 (ADR 0041)

jobs:
  ux-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: データブランチを取得
        run: |
          if ! git ls-remote --exit-code --heads origin "$UX_DATA_BRANCH" >/dev/null 2>&1; then
            # ブランチが無い = 記録が 1 件も積まれていない。黙って skip すると
            # 「プローブが止まったまま計測も静かに止まる」ので赤で表現する
            echo "::error::データブランチ $UX_DATA_BRANCH がありません — golden-path-monitor の追記か初期移行 (ux-data-migrate) がまだです"
            exit 1
          fi
          git fetch origin "$UX_DATA_BRANCH"
          git worktree add /tmp/ux-data FETCH_HEAD
          echo "probes: $(cat /tmp/ux-data/probes/*.jsonl 2>/dev/null | wc -l) 行 / evals: $(cat /tmp/ux-data/evals/*.jsonl 2>/dev/null | wc -l) 行"

      - name: 機械計測を抽出 (鮮度 26h + 評価済み runId を確認)
        id: eval
        run: |
          # 終了コードは必ずコマンド単体の直後に取る (PR #157 レビュー指摘と同じ理由)
          set +e
          python3 cicd/scripts/ux-eval/ux_eval.py /tmp/ux-data > /tmp/ux-eval-payload.json
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            # 鮮度切れ / 記録なしは**この run の赤で表現する** (ADR 0037 D1)。
            # 黙って skip すると「プローブが止まったまま計測も静かに止まる」が再発する
            echo "::error::26 時間以内のプローブ記録がありません — golden-path-monitor か記録の追記が止まっています (詳細は上のログ)"
            exit 1
          fi
          if [ "$rc" -eq 4 ]; then
            # 前日の記録しか無い朝 — 重複を積まず、入力が止まったことを赤で表現する
            echo "::error::最新のプローブ記録は評価済みです — 今朝の新しい記録が来ていません (golden-path-monitor の停止か追記失敗。詳細は上のログ)"
            exit 1
          fi
          exit "$rc"

      - name: データブランチへ追記
        id: post
        run: |
          ./cicd/scripts/ux-data/append-observation.sh /tmp/ux-eval-payload.json
          echo "$UX_DATA_BRANCH の evals/ に追記した"

      # 落ちたことに気づける唯一の経路。別の見張りを置かず、落ちた当人が Issue を立てる
      # (ADR 0035 D2)。緑になれば同じ Issue を自分で閉じる。
      - name: 失敗を Issue にする / 復旧したら閉じる
        if: always()
        uses: ./.github/actions/report-failure
        with:
          job-status: ${{ job.status }}
          # 追記まで通って初めて「計測が積まれた」— 手前で止まった success (無いはずだが)
          # を復旧と誤認しないため、post の成否で判定する
          work-ran: ${{ steps.post.outcome == 'success' }}
          what: "**毎朝の UX 機械計測 (ux-eval) が落ちています。** プローブ記録が古い/無いか、データブランチ (data/ux-observations) への追記に失敗しています。レイテンシのトレンドが途切れます。"
