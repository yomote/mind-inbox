name: diag

# 一時診断: BFF(func) を直接叩いて BFF→ai-agent の疎通を確認する（runner は egress 制限外）。
# func の trpc は authLevel=anonymous なので SWA 認証を迂回してテストできる。
on:
  workflow_dispatch:
    inputs:
      func:
        description: Function App 名
        default: func-dev-mindbox
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: BFF health.ping (direct, anonymous)
        run: |
          FUNC="${{ github.event.inputs.func }}"
          echo "== GET /api/trpc/health.ping =="
          curl -sS -m 30 -w '\nHTTP=%{http_code} t=%{time_total}s\n' \
            "https://$FUNC.azurewebsites.net/api/trpc/health.ping?batch=1&input=%7B%220%22%3A%7B%7D%7D" | head -c 600 || true

      - name: BFF consultation.start (direct → calls ai-agent → gpt-5-mini)
        run: |
          FUNC="${{ github.event.inputs.func }}"
          echo "== POST /api/trpc/consultation.start (tRPC batch) =="
          curl -sS -m 150 -w '\nHTTP=%{http_code} t=%{time_total}s\n' \
            -X POST "https://$FUNC.azurewebsites.net/api/trpc/consultation.start?batch=1" \
            -H 'Content-Type: application/json' \
            -d '{"0":{"concern":"接続テストです。ひとことで返してください。"}}' | head -c 2000 || true

      - name: ai-agent /chat (direct, warm) — 参照用
        run: |
          FQDN="$(az containerapp show -g rg-dev-mind-inbox -n ca-dev-mindbox-ai-agent --query 'properties.configuration.ingress.fqdn' -o tsv)"
          echo "ai-agent: https://$FQDN"
          curl -sS -m 120 -w '\nHTTP=%{http_code} t=%{time_total}s\n' \
            -X POST "https://$FQDN/chat" -H 'Content-Type: application/json' \
            -d '{"session_id":"diag","message":"接続テスト。ひとことで。"}' | head -c 800 || true
