name: test

on:
  pull_request:
    branches: [main]
  # merge queue の一時 branch でも required check を報告する (ADR 0042)。
  # これが無いと queue に入った PR は test / lint-and-build が永遠に pending で
  # タイムアウト脱落する。queue 有効化は needs-human #269。
  merge_group:
  push:
    branches: [main]

# 信頼境界 (PR #271 Codex P1 / ADR 0042): test / lint-and-build は PR 由来の
# npm / pnpm スクリプト (= 未信頼コード) を実行する。merge_group では fork PR でも
# GITHUB_TOKEN が read-only に落ちない (base リポジトリのイベント) ため、
# これらの job に write を持たせない。PR コメントの投稿だけを、未信頼コードを
# 実行しない別 job (pr-comment) に分離して最小権限で行う。
permissions:
  contents: read

jobs:
  test:
    name: test (L0 / L1+L2 / L3 / L3-real)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install root deps
        run: npm ci

      - name: Install bff deps
        run: npm --prefix apps/bff ci

      - name: Install frontend deps
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Sync ai-agent (with dev deps)
        working-directory: apps/services/ai-agent
        run: uv sync --dev

      - name: L0 contract
        id: l0
        continue-on-error: true
        run: npm run test:contract

      - name: L1+L2 fast (parallel BFF / Frontend / Python)
        id: fast
        continue-on-error: true
        run: npm run test:fast

      # L3 は chromium が要る。ランナーには入っていないので毎回入れる
      # (--with-deps で OS 側の共有ライブラリも揃える)。
      - name: Install Playwright chromium
        run: pnpm --dir apps/frontend exec playwright install --with-deps chromium

      - name: L3 e2e
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      # L3-real — mock を通らない実配線でユースケースを通す (ADR 0032)。
      # ai-agent ダブル + 実 BFF (素の node 配信) を Playwright の webServer が起動する。
      - name: L3-real uc acceptance
        id: e2e_uc
        continue-on-error: true
        run: pnpm --dir apps/frontend run test:e2e:uc

      - name: Upload Playwright report (失敗時のみ)
        if: steps.e2e.outcome == 'failure' || steps.e2e_uc.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results-uc/
          retention-days: 7

      - name: Build summary
        run: |
          fmt() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              skipped) echo "skip" ;;
              *)       echo "$1" ;;
            esac
          }
          {
            echo "## テスト実行結果"
            echo ""
            echo "| Layer | Status | コマンド |"
            echo "| --- | --- | --- |"
            echo "| L0 contract | $(fmt ${{ steps.l0.outcome }}) | \`npm run test:contract\` |"
            echo "| L1+L2 fast  | $(fmt ${{ steps.fast.outcome }}) | \`npm run test:fast\` |"
            echo "| L3 e2e      | $(fmt ${{ steps.e2e.outcome }}) | \`npm run test:e2e\` |"
            echo "| L3-real uc  | $(fmt ${{ steps.e2e_uc.outcome }}) | \`pnpm --dir apps/frontend run test:e2e:uc\` |"
            echo ""
            echo "詳細は各 Step のログを参照。VOICEVOX の L1 (#2) だけ placeholder (exit 0) のため pass 表示になります。"
            echo ""
            echo "戦略: [docs/testing/strategy.md](https://github.com/yomote/mind-inbox/blob/main/docs/testing/strategy.md)"
          } | tee pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      # コメント投稿は write 権限を持つ別 job (pr-comment) へ渡す — この job は
      # 未信頼コードを実行するため write を持たない (冒頭「信頼境界」参照)
      - name: Upload summary for PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-summary-md
          path: pr-comment.md
          retention-days: 1

      - name: Fail if any layer failed
        run: |
          if [ "${{ steps.l0.outcome }}" != "success" ] || \
             [ "${{ steps.fast.outcome }}" != "success" ] || \
             [ "${{ steps.e2e.outcome }}" != "success" ] || \
             [ "${{ steps.e2e_uc.outcome }}" != "success" ]; then
            echo "::error::One or more test layers failed"
            exit 1
          fi

  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install root deps
        run: npm ci

      - name: Install bff deps
        run: npm --prefix apps/bff ci

      - name: Install frontend deps
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Sync ai-agent (with dev deps)
        working-directory: apps/services/ai-agent
        run: uv sync --dev

      - name: Lint (BFF / Frontend / Python / Markdown)
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck + build BFF (tsc)
        id: build_bff
        continue-on-error: true
        run: npm --prefix apps/bff run build

      - name: Typecheck + build Frontend (tsc + vite)
        id: build_frontend
        continue-on-error: true
        run: pnpm --dir apps/frontend run build

      - name: Docs OpenAPI (BFF) regen + diff
        id: openapi_bff
        continue-on-error: true
        run: |
          npm run docs:openapi:bff
          git diff --exit-code docs/api/bff-trpc.yaml || {
            echo "::error::docs/api/bff-trpc.yaml が router の zod schema と乖離しています。ローカルで 'npm run docs:openapi:bff' を実行して commit してください。"
            exit 1
          }

      - name: Build summary
        run: |
          fmt() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              skipped) echo "skip" ;;
              *)       echo "$1" ;;
            esac
          }
          {
            echo "## Lint / Build 実行結果"
            echo ""
            echo "| カテゴリ | Status | コマンド |"
            echo "| --- | --- | --- |"
            echo "| Lint (BFF / Frontend / Python / Markdown) | $(fmt ${{ steps.lint.outcome }}) | \`npm run lint\` |"
            echo "| Build BFF (tsc)                            | $(fmt ${{ steps.build_bff.outcome }}) | \`npm --prefix apps/bff run build\` |"
            echo "| Build Frontend (tsc + vite)                | $(fmt ${{ steps.build_frontend.outcome }}) | \`pnpm --dir apps/frontend run build\` |"
            echo "| OpenAPI (BFF) 再生成 + diff                 | $(fmt ${{ steps.openapi_bff.outcome }}) | \`npm run docs:openapi:bff\` |"
            echo ""
            echo "戦略: [docs/testing/strategy.md §5.3](https://github.com/yomote/mind-inbox/blob/main/docs/testing/strategy.md)"
          } | tee lint-build-comment.md >> "$GITHUB_STEP_SUMMARY"

      # コメント投稿は write 権限を持つ別 job (pr-comment) へ渡す (冒頭「信頼境界」参照)
      - name: Upload summary for PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-build-summary-md
          path: lint-build-comment.md
          retention-days: 1

      - name: Fail if any check failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.build_bff.outcome }}" != "success" ] || \
             [ "${{ steps.build_frontend.outcome }}" != "success" ] || \
             [ "${{ steps.openapi_bff.outcome }}" != "success" ]; then
            echo "::error::Lint or build check failed"
            exit 1
          fi

  # PR への sticky コメント投稿だけを担う job (PR #271 Codex P1)。
  # 未信頼コード (npm / pnpm スクリプト) を一切実行しないので、ここにだけ
  # pull-requests: write を許す。artifact の中身は PR 由来の markdown だが、
  # コメント本文として貼るだけで権限昇格には使えない。
  pr-comment:
    name: Sticky PR comments
    runs-on: ubuntu-latest
    needs: [test, lint-and-build]
    # テストが赤でも FAIL の表を貼るため always()。merge_group / push では動かない
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # summary が作られる前に job が落ちた場合は artifact が無い — その場合は
      # コメントもスキップ (continue-on-error + outcome ガード)
      - name: Download test summary
        id: dl_test
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-summary-md

      - name: Download lint-build summary
        id: dl_lint
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lint-build-summary-md

      - name: Sticky PR comment (test)
        if: steps.dl_test.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: test-summary
          path: pr-comment.md

      - name: Sticky PR comment (lint-build)
        if: steps.dl_lint.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: lint-build-summary
          path: lint-build-comment.md
