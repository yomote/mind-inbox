# ADR 採番の衝突ガード (ADR 0028 D3 / Issue #159)
#
# 採番手順は docs/adr/README.md に「origin/main の最大番号 +1」と書いてあるが、
# **記述だけでは 2 回衝突している** (0015→0019 / 0026→0027)。どちらも並行セッションが
# ローカルの最大値から採番したことが原因。規約ではなく機械で落とす。
#
# 検査は 2 つ:
#   1. PR 側で同一番号の ADR が複数ある (自分の中で衝突している)
#   2. PR が追加した番号が base に既に存在する (並行採番で衝突している)
name: adr-number-guard

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/adr/**"
  # merge queue の一時 branch でも required check を報告する (ADR 0042)。
  # merge_group に paths フィルタは効かない (push / pull_request 限定) ため常に走る —
  # ADR 変更の無い merge group では「衝突なし」で緑になるだけ。副産物として、
  # 同じ番号を採った 2 PR が同一 queue に載った場合も HEAD 側の重複検査で捕まる。
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: ADR 番号の衝突を検査
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 番号の重複を検査
        env:
          # merge_group では base_sha = queue の合流先 (main tip または先行 group の head)
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          nums_of() {
            # $1 = git ref。ADR ファイル名の先頭 4 桁を並べる (template.md / README.md は除外)
            git ls-tree -r "$1" --name-only docs/adr/ 2>/dev/null \
              | grep -oE 'docs/adr/[0-9]{4}-' \
              | grep -oE '[0-9]{4}' | sort
          }

          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA"

          PR_NUMS="$(nums_of HEAD)"
          BASE_NUMS="$(nums_of "$BASE_SHA")"

          FAILED=0

          # 1. PR 内での重複 (同じ番号のファイルが 2 つある)
          DUP_IN_PR="$(echo "$PR_NUMS" | uniq -d)"
          if [ -n "$DUP_IN_PR" ]; then
            FAILED=1
            echo "$DUP_IN_PR" | while read -r n; do
              [ -z "$n" ] && continue
              echo "::error title=ADR 番号の重複::番号 $n の ADR が複数あります"
              git ls-tree -r HEAD --name-only docs/adr/ | grep "/$n-" | sed 's/^/    /'
            done
          fi

          # 2. PR が追加した番号が base に既存 (並行採番の衝突)
          ADDED="$(comm -13 <(echo "$BASE_NUMS" | uniq) <(echo "$PR_NUMS" | uniq) || true)"
          COLLIDED=""
          for n in $ADDED; do
            # 追加された番号のうち、base 側にも同じ番号のファイルが**別名で**存在するもの
            if echo "$BASE_NUMS" | grep -qx "$n"; then
              COLLIDED="${COLLIDED}${n} "
            fi
          done

          # comm では拾えないケース (同じ番号・違うファイル名) を直接照合する
          for n in $(echo "$PR_NUMS" | uniq); do
            pr_file="$(git ls-tree -r HEAD --name-only docs/adr/ | grep "/$n-" | head -1)"
            base_file="$(git ls-tree -r "$BASE_SHA" --name-only docs/adr/ | grep "/$n-" | head -1 || true)"
            if [ -n "$base_file" ] && [ "$pr_file" != "$base_file" ]; then
              FAILED=1
              echo "::error file=${pr_file},title=ADR 番号が base と衝突::番号 $n は base に既に存在します"
              echo "    PR:   $pr_file"
              echo "    base: $base_file"
            fi
          done

          {
            echo "## adr-number-guard (ADR 0028 D3)"
            echo
            NEXT="$(echo "$BASE_NUMS" | tail -1)"
            if [ -n "$NEXT" ]; then
              printf -- "- base (origin/main) の最大番号: \`%s\` → 次に使えるのは \`%04d\`\n" \
                "$NEXT" "$((10#$NEXT + 1))"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            {
              echo
              echo "🔴 **番号が衝突しています。** 採番は \`ls docs/adr/\` のローカル最大値ではなく、"
              echo "**origin/main の最大番号 +1** で取り直してください (README.md 参照)。"
              echo "ファイル名・本文の見出し・README の索引・参照している全ファイルを揃えて直すこと。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice title=adr-number-guard::ADR 番号の衝突なし"
          echo "🟢 衝突なし" >> "$GITHUB_STEP_SUMMARY"
