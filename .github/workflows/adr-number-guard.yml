# ADR 採番の衝突ガード (ADR 0028 D3 / Issue #159 / #381)
#
# 採番手順は docs/adr/README.md に「origin/main の最大番号 +1」と書いてあるが、
# **記述だけでは 2 回衝突している** (0015→0019 / 0026→0027)。規約ではなく機械で落とす。
#
# 判定は cicd/scripts/adr-number-guard/adr_guard.py (純関数 + pytest) — 検査内容・
# 設計判断はそちらの docstring が正典。ここには配線だけを置く (判定を YAML の
# シェルに埋めない — cicd/CLAUDE.md)。
#
# 比較先は **run 時点の origin/main** (Issue #381):
#   旧実装は `github.event.pull_request.base.sha` (= PR イベント発火時点の base) と
#   比較していた。guard が緑を出した後に並行 PR が同じ番号を main に着地させても
#   再判定されず、緑のまま腐る (PR #222 で ADR 0048 が二重化寸前)。スクリプトが
#   run のたびに origin/main を fetch するため、re-run すればその時点の main で
#   判定し直せる。それでも「run 後〜マージ前」の窓は残る — マージ直前の再判定は
#   review-gate (pm-accept のたびに再評価) が同じ純関数 (gate_conflicts) で行う。
#   Merge Queue は安全網にならない (このリポジトリでは使えない — ADR 0042 D2)。
name: adr-number-guard

on:
  # **paths フィルタは付けない。** 付けると ADR に触れない PR ではこの check が走らず、
  # required にした瞬間その PR が永久 pending になる (cicd/github/settings.yml の警告)。
  # ADR 変更が無い PR では「衝突なし」で即緑になるだけなので、常時走らせて門にする。
  pull_request:
    branches: [main]
  # merge queue の一時 branch でも required check を報告する (ADR 0042)。
  # merge_group に paths フィルタは効かない (push / pull_request 限定) ため常に走る —
  # ADR 変更の無い merge group では「衝突なし」で緑になるだけ。
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: ADR 番号の衝突を検査
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base の計算と PR head の ls-tree に履歴が要る
          fetch-depth: 0

      - name: 番号の重複を今の main と照合して検査
        env:
          # pull_request では checkout の HEAD (= イベント時点の base への test merge
          # commit) ではなく **PR head そのもの**を判定対象にする — merge commit は
          # イベント時点の base を焼き込んでおり、その分だけ判定が腐る (#381)。
          # merge_group では github.sha (= queue の一時 branch の head) をそのまま使う
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 cicd/scripts/adr-number-guard/adr_guard.py --head "$HEAD_SHA"
