# GitHub の設定を宣言から点検 / 適用する (Issue #344)。
#
# 背景: Azure は「宣言から作り直せるもの」になった (ADR 0046) が、GitHub 側の設定
#   (ブランチ保護 / required check / secret scanning / Dependabot / CodeQL) だけは
#   人が Web UI でクリックした結果としてしか存在しなかった。別リポジトリに流用できず、
#   今どうなっているかも分からず、変更の記録も無い。
#
# なぜ device-code か (鍵をどこにも保管しない):
#   - **エージェントはリポジトリ管理系 API に到達できない** (実測: 403 "GitHub access
#     is not enabled for this session.")。これはガードレールなので迂回しない
#   - CI に admin PAT を置くと、**同一リポジトリの PR から secret を読める経路**で
#     リポジトリ管理権限が漏れる (#331 と同型)。だから secret に置かない
#   - PO はスマホで作業している。ローカルでスクリプトを流す運用にできない
#   → **Actions 上で PO 本人が device-code 認証する**。トークンはこの run の中だけに
#     存在し、どこにも保存されない (device flow の client_id は公開値なので OAuth
#     アプリの登録も要らない)
#
# コードの出し方 (#362 で作り直した): `gh auth login --web` の対話に頼らず、
#   device flow を自分で叩いて **コードを ::notice:: で出す**。理由は
#   cicd/scripts/github-settings/device_login.py の冒頭 (実測つき)。
#
# 意図と事実の置き場 (ADR 0041 と同じ流儀 — state を Issue コメントに溜めない):
#   - **意図 (宣言)** = main の `cicd/github/settings.yml` (人が PR で編集する)
#   - **事実 (観測)** = データブランチ `data/github-settings` の JSON
#     (点検のたびに上書き。**変化した回だけコミットが立つ**ので `git log -p` が
#      「いつ設定が変わったか」の記録そのものになる)
#   - Issue は state の置き場ではなく、**ドリフトを見つけたときだけ**立てる
#     (debt-check / security-sweep と同じ冪等な起票パターン)
#
# 分担: この workflow は I/O だけ。判定 (差分・適用順序・ダイジェスト) は
#   cicd/scripts/github-settings/settings_diff.py (テスト済みの純関数)。
#
# 🔒 約束:
#   - **check は読み取りのみ** (GET しか叩かない)
#   - **apply は「PO が見た差分」しか適用しない** — check が出したダイジェストを
#     入力に取り、いま計算し直した計画と一致しなければ何もしない
#   - **保護を弱める操作は allow_weakening を明示しない限り実行しない**
#   - **device-code のトークンを git に触らせない** — データブランチへの push は
#     checkout が仕込んだ GITHUB_TOKEN で行う
#   - 入力を run: に直接展開しない (必ず env 経由 / ops-inspect と同じ規律)
name: github-settings

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 見るだけ / apply = 差分を適用する"
        required: true
        type: choice
        options:
          - check
          - apply
        default: check
      plan_digest:
        description: "apply のとき必須: check が出した 12 桁のダイジェスト"
        required: false
        type: string
        default: ""
      allow_weakening:
        description: "保護を弱める操作を許可する (apply のときだけ意味を持つ)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # データブランチ (data/github-settings) への push
  issues: write # ドリフト Issue の起票 / 追記 / クローズ

concurrency:
  group: github-settings
  cancel-in-progress: false

env:
  DECLARATION: cicd/github/settings.yml
  WORKDIR: /tmp/github-settings
  ISSUE_LABEL: github-settings
  ISSUE_PREFIX: "[github-settings]"

jobs:
  sync:
    name: 設定を点検する (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # device flow の待ち時間 (コードの有効期限 15 分) + 前後の処理
    timeout-minutes: 25

    steps:
      # 特権トークンを握る workflow なので、**main の版以外では動かさない**。
      # これが無いと、書き込み権限を持つ人が自分のブランチで yml を書き換えて
      # PO の device トークンを別の用途に使わせられる (review-gate.yml の
      # workflow_dispatch を置かない判断と同じ理由)。
      - name: main の版であることを確認する
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::この workflow は $DEFAULT_BRANCH の版だけを実行できます (今: $REF_NAME)。"
            echo "::error::Run workflow の「Use workflow from」で $DEFAULT_BRANCH を選び直してください。"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: 宣言 (YAML) を読むための依存
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3

      # ここで PO 本人がスマホのブラウザから承認する。
      # コードはこのログに出る (機微ではない — 承認できるのは GitHub にログイン
      # している本人だけ)。トークンはログにも出力にも出さない。
      # device flow を自分で叩く。**`gh auth login --web` は使わない** (#362):
      #   2026-08-12 の初回実行 (run 31619029180) で、疑似端末越しの gh が
      #   ワンタイムコードを 1 バイトも出力しないまま 12 分ハングした。
      #   コードが出るかどうかを gh の対話実装に委ねる形をやめ、自分で出す。
      # コードは ::notice:: で出す → run サマリにカードで出るのでモバイルでも見え、
      #   annotation として **走行中でも API から読める** (窓口 PM が PO へ転記できる)。
      - name: device-code で認証する (PO 本人がブラウザで承認)
        id: login
        # コードは即座に出る。ここが長いのは PO の承認を待つ時間だけ。
        timeout-minutes: 12
        env:
          # 万一 client_id を差し替える必要が出たとき、コード変更なしで効くように
          GH_OAUTH_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
        run: |
          set -uo pipefail
          mkdir -p "$WORKDIR"
          python3 cicd/scripts/github-settings/device_login.py \
            --scopes "repo,read:org" \
            --token-out "$WORKDIR/token" \
            --max-wait 600
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::device-code の認証が完了しませんでした (exit $rc)。"
            echo "::error::**何も変更していません**。もう一度 dispatch すれば新しいコードが出ます。"
            exit 1
          fi

      # ここから先が本題。device トークンは **このステップの中だけ**で env に載せる
      # ($GITHUB_ENV に出すと以降の全ステップ — データブランチへの push を含む — に
      #  漏れる)。GITHUB_TOKEN では管理系 API に届かないので、ここは device 側を使う。
      - name: 点検 / 適用
        id: sync
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          ALLOW_WEAKENING: ${{ inputs.allow_weakening }}
        run: |
          set -uo pipefail
          mkdir -p "$WORKDIR"
          if [ ! -s "$WORKDIR/token" ]; then
            echo "::error::device トークンがありません (認証ステップが成功していない)"
            exit 1
          fi
          export GH_TOKEN
          GH_TOKEN="$(cat "$WORKDIR/token")"
          extra=()
          if [ "$ALLOW_WEAKENING" = "true" ]; then extra+=(--allow-weakening); fi
          python3 cicd/scripts/github-settings/sync.py \
            --mode "$MODE" \
            --declaration "$DECLARATION" \
            --expect-digest "$PLAN_DIGEST" \
            --snapshot-out "$WORKDIR/snapshot.json" \
            --report-out "$WORKDIR/report.md" \
            "${extra[@]}" > "$WORKDIR/summary.json"
          rc=$?
          cat "$WORKDIR/summary.json" || true
          if [ -f "$WORKDIR/report.md" ]; then
            cat "$WORKDIR/report.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$WORKDIR/report.md"
          fi
          exit "$rc"

      # 特権トークンは用が済んだら即捨てる (run が続く間も持ち歩かない)。
      - name: トークンを捨てる
        if: always()
        run: |
          rm -f "$WORKDIR/token"
          # gh のストアは使っていないが、将来 gh auth login に戻したときの取り残し防止
          rm -rf ~/.config/gh
          echo "device-code のトークンを破棄しました"

      # 事実をデータブランチへ。push は GITHUB_TOKEN で行う (device トークンは既に破棄済み)。
      - name: 観測をデータブランチに置く
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f "$WORKDIR/snapshot.json" ]; then
            echo "::warning::スナップショットが作られていません (認証か点検が失敗している)"
            exit 0
          fi
          cicd/scripts/github-settings/write-snapshot.sh \
            "$WORKDIR/snapshot.json" "$GITHUB_REPOSITORY"

      # ドリフト (差分 or 未検証) があるときだけ Issue を立てる / 追記する。
      # 解消したら閉じる。0 件なら起票せず run の緑とデータブランチのコミットが痕跡
      # (ADR 0035 D1 / debt-check と同じ冪等パターン)。
      - name: ドリフトを Issue に積む / 解消したら閉じる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -uo pipefail
          if [ ! -f "$WORKDIR/summary.json" ] || [ ! -s "$WORKDIR/summary.json" ]; then
            echo "::warning::集計結果が無いので Issue の判定をしません"
            exit 0
          fi
          DRIFT=$(jq -r '.drift' "$WORKDIR/summary.json")
          UNAVAILABLE=$(jq -r '.unavailable' "$WORKDIR/summary.json")

          gh label create "$ISSUE_LABEL" -R "$GITHUB_REPOSITORY" --color 1d76db \
            --description "宣言 (cicd/github/settings.yml) と実際の GitHub 設定のズレ" \
            2>/dev/null || true

          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open \
                       --json number,title --limit 50 \
                       --jq "[.[] | select(.title | startswith(\"$ISSUE_PREFIX\")) | .number] | first // empty")

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$DRIFT" = "0" ] && [ "$UNAVAILABLE" = "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" \
                -b "宣言と現実が一致しました (mode: $MODE / run: $RUN_URL)。閉じます。"
              gh issue close "$EXISTING" -R "$GITHUB_REPOSITORY" \
                --reason completed
              echo "#$EXISTING を閉じました"
            else
              echo "ドリフトなし — Issue は立てません (痕跡は run 履歴とデータブランチ)"
            fi
            exit 0
          fi

          TITLE="$ISSUE_PREFIX $(date -u -d '+9 hours' +%Y-%m-%d): 差分 $DRIFT 件 / 未検証 $UNAVAILABLE 件"
          {
            echo "- run: $RUN_URL"
            echo "- 宣言 (意図): \`cicd/github/settings.yml\` — 直すならここを PR で編集する"
            echo "- 観測 (事実): データブランチ \`data/github-settings\` (\`git log -p\` で変化が読める)"
            echo "- 適用手順: [docs/runbooks/github-settings.md](../blob/main/docs/runbooks/github-settings.md)"
            echo ""
            cat "$WORKDIR/report.md"
          } > "$WORKDIR/issue-body.md"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" -F "$WORKDIR/issue-body.md"
            echo "既存の #$EXISTING に追記しました"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label "$ISSUE_LABEL" -F "$WORKDIR/issue-body.md" || {
              echo "::error::Issue を作成できませんでした (permissions: issues: write を確認)"
              exit 1
            }
            echo "新しい Issue を立てました"
          fi

      # 最後に run の色を決める。**読めなかった項目があるのに緑にしない**
      # (取れなかったものを合格と書かない / security-sweep と同じ規律)。
      - name: 結果で run の色を決める
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          set -uo pipefail
          if [ ! -f "$WORKDIR/summary.json" ] || [ ! -s "$WORKDIR/summary.json" ]; then
            echo "::error::点検を実行できませんでした (認証 / 前提の失敗。上のログを見てください)"
            exit 1
          fi
          UNAVAILABLE=$(jq -r '.unavailable' "$WORKDIR/summary.json")
          if [ "$SYNC_OUTCOME" != "success" ]; then
            echo "::error::点検 / 適用が失敗しました (ダイジェスト不一致・許可なしの弱化・API 失敗のいずれか)"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "0" ]; then
            echo "::error::$UNAVAILABLE 項目を読み取れませんでした。「一致」とは書けません (詳細は Issue とログ)"
            exit 1
          fi
          echo "点検できました"
