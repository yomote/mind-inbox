# ゴールデンパス定期監視 (#108 / ADR 0018)
#
# デプロイ契機ではなく**時間経過で壊れる**ものを毎日検出する。実例 (2026-08-08):
# Functions の送信元 IP 変動で BFF → Container Apps が 403 になり、デプロイなしで
# 対話が全滅した (その障害自体は認証の門への移行で根治済み — ADR 0017)。
# Entra 設定のドリフト・トークン期限系・下流の死活など「昨日は通っていたのに」を
# 朝イチで検出し、ユーザーが踏む前に赤くする。
#
# 失敗時: この workflow が fail になり GitHub が通知する。原因の切り分けは
# ジョブログの NG 行 (どのホップで壊れたか) を見る。手動再実行は workflow_dispatch。
name: golden-path-monitor

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 JST 毎朝
  workflow_dispatch:

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: read
  issues: write # プローブ記録を蓄積 Issue #162 へ投稿する (ADR 0029)

env:
  RG: rg-dev-mind-inbox
  DEPLOYMENT: main-bootstrap

jobs:
  golden-path:
    runs-on: ubuntu-latest
    # curl 版 (コールドスタート込み最大 ~11 分) + UI E2E (playwright install + 最大 210s 待ち)
    # + UX プローブ (相談 4 往復・実 AI, 最大 ~15 分 — #123 M0) の積み上げに耐える余裕
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Guard — OIDC 設定済みか
        id: guard
        run: |
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_* variables 未設定のためスキップ"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Golden path（API ホップ切り分け・実 AI）
        if: steps.guard.outputs.run == 'true'
        run: |
          RG="$RG" DEPLOYMENT="$DEPLOYMENT" ./cicd/scripts/smoke-test/golden-path.sh

      - name: Setup Node 22
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # UI 込みのシナリオテスト。フロント↔BFF の結線破壊はここでしか捕まらない。
      # e2e-live には UX プローブ (ux-probe.spec.ts — #123 M0) も含まれ、相談 4 往復の
      # 全応答文 + 区間レイテンシを probe-results/*.json に記録する
      - name: Golden path scenario + UX プローブ（UI 込み E2E・実環境）
        if: steps.guard.outputs.run == 'true'
        run: |
          OUTPUTS="$(az deployment group show -g "$RG" -n "$DEPLOYMENT" --query 'properties.outputs' -o json)"
          _val() { echo "$OUTPUTS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$1',{}).get('value',''))"; }
          export LIVE_APP_URL="https://$(_val staticSiteDefaultHostname)"
          export LIVE_BFF_URL="https://$(_val functionAppDefaultHostname)"
          export LIVE_ENTRA_CLIENT_ID="$(_val functionAuthEntraClientId)"
          export LIVE_ENTRA_TENANT_ID="$(_val functionAuthEntraTenantId)"
          export LIVE_BFF_TOKEN="$(az account get-access-token --scope "api://$LIVE_ENTRA_CLIENT_ID/.default" --query accessToken -o tsv)"
          # 実トークンをログ・trace への漏出から守る (レビュー指摘)
          echo "::add-mask::$LIVE_BFF_TOKEN"
          cd apps/frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e:live

      # UX プローブ記録の要約: レイテンシ閾値超過を warn annotation (#120「まず測る」) にし、
      # step summary に往復ごとの数値を出す。テスト自体はレイテンシで fail しない (仕分けは judge)
      - name: UX プローブ記録の要約 (レイテンシ warn + step summary)
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'EOF'
          import glob, json, os
          files = sorted(glob.glob("apps/frontend/probe-results/*.json"))
          if not files:
              print("::notice::UX プローブ記録なし (プローブ手前で fail した可能性 — E2E ログ参照)")
              raise SystemExit(0)
          rec = json.load(open(files[-1]))
          lines = [
              "## UX プローブ (#123 M0 / ADR 0022)",
              f"- scenario: `{rec['scenario']['id']}` / 完了 {rec['summary']['completedTurns']}/{rec['scenario']['plannedTurns']} 往復",
              f"- send→応答表示: avg {rec['summary']['avgSendToReplyVisibleMs']}ms / max {rec['summary']['maxSendToReplyVisibleMs']}ms (1 往復目はコールドスタート込み)",
              "",
              "| turn | send→tRPC | send→表示 | TTS合成 | warn |",
              "| --- | --- | --- | --- | --- |",
          ]
          for t in rec["turns"]:
              tm = t["timings"]
              tts = f"{tm['ttsRequestToResponseMs']}ms" if tm["ttsRequestToResponseMs"] is not None else "n/a"
              lines.append(
                  f"| {t['index']} | {tm['sendToTrpcResponseMs']}ms | {tm['sendToReplyVisibleMs']}ms "
                  f"| {tts} | {len(t['warnings'])} |"
              )
              for w in t["warnings"]:
                  print(f"::warning title=UX probe turn {t['index']} ({w['category']})::{w['message']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print(f"summary written for {files[-1]}")
          EOF

      # 記録 JSON は artifact と Issue コメントの両方に残す (ADR 0029 / #160)。
      # artifact = 障害調査用の一次情報 (人間が gh で取る)。
      # Issue コメント = 毎朝の採点 Routine の入力 (agent が MCP で読む)。
      # agent セッションからは artifact をダウンロードできない (ダウンロード先の
      # *.blob.core.windows.net が egress ポリシーで拒否される) ため、artifact だけでは
      # 採点ループが起動しない。リポジトリへの commit は monitor に contents:write を
      # 与える必要があり引き続き不採用 (判断は PR #123 M0 を参照)。
      - name: UX プローブ記録を artifact として保存
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ux-probe-${{ github.run_id }}
          path: apps/frontend/probe-results/
          if-no-files-found: ignore
          retention-days: 90

      # 投稿に失敗しても monitor 自体は赤くしない (この workflow の役目はゴールデンパスの
      # 死活であって記録の運搬ではない)。代わりに warning annotation を残し、翌朝の採点
      # Routine が「材料なし」を報告することで二重に気づけるようにする。
      - name: UX プローブ記録を蓄積 Issue へ投稿 (採点 Routine の入力)
        if: always() && steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RECORD_ISSUE: "162"
        run: |
          PROBE_JSON="$(ls -1 apps/frontend/probe-results/*.json 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$PROBE_JSON" ]; then
            echo "::notice::UX プローブ記録なし — 蓄積 Issue への投稿をスキップ"
            exit 0
          fi

          # 終了コードは必ずコマンド単体の直後に取る (PR #157 レビュー指摘と同じ理由)
          set +e
          python3 cicd/scripts/ux-probe/probe-record-comment.py format "$PROBE_JSON" > /tmp/probe-comment.md
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::warning::プローブ記録をコメント化できませんでした (exit $rc) — artifact から調査してください"
            exit 0
          fi

          gh issue comment "$PROBE_RECORD_ISSUE" -R "$GITHUB_REPOSITORY" -F /tmp/probe-comment.md

      # 落ちたときの一次情報 (trace / screenshot)。緑のときは不要
      - name: E2E レポートを artifact として保存 (失敗時のみ)
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report-${{ github.run_id }}
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results-live/
          if-no-files-found: ignore
          retention-days: 14
