# ゴールデンパス定期監視 (#108 / ADR 0018)
#
# デプロイ契機ではなく**時間経過で壊れる**ものを毎日検出する。実例 (2026-08-08):
# Functions の送信元 IP 変動で BFF → Container Apps が 403 になり、デプロイなしで
# 対話が全滅した (その障害自体は認証の門への移行で根治済み — ADR 0017)。
# Entra 設定のドリフト・トークン期限系・下流の死活など「昨日は通っていたのに」を
# 朝イチで検出し、ユーザーが踏む前に赤くする。
#
# 失敗時: この workflow が fail になり GitHub が通知する。原因の切り分けは
# ジョブログの NG 行 (どのホップで壊れたか) を見る。手動再実行は workflow_dispatch。
name: golden-path-monitor

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 JST 毎朝
  workflow_dispatch:

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: write # プローブ記録をデータブランチ data/ux-observations へ追記する (ADR 0041)
  issues: write # 失敗時の自己通報 (report-failure)

env:
  RG: rg-dev-mind-inbox
  DEPLOYMENT: main-bootstrap

jobs:
  golden-path:
    runs-on: ubuntu-latest
    # 待受予算の積み上げ (playwright.live.config.ts は workers: 1 = 直列。全部を足す):
    #   curl 版 (コールドスタート込み最大 ~11 分) + 永続化プローブ ~1 分
    #   + pnpm install / playwright install ~4 分
    #   + e2e-live: ux-probe **2 シナリオ** × 1,700s (#435 / 予算式は
    #     apps/frontend/e2e-live/ux-probe-scenarios.ts の probeTestTimeoutMs)
    #     + 他 3 本 × 240s (config の既定) = 計 4,120s ≒ 68.7 分
    #   + 失敗証拠 / trace 暗号化 / データブランチ追記の後段 ~3 分
    #   = 最悪 ~88 分。**足りないと途中で job ごと打ち切られ、report-failure にも
    #   artifact のアップロードにも到達できない** (= 落ちたのに通報が残らない / PR #399 レビュー指摘)。
    # 余裕を 7 分積んで 95 分。**シナリオを足したらこの数字も動かすこと**
    # (1 シナリオ = 最悪 +28 分)。
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard — OIDC 設定済みか
        id: guard
        run: |
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "${{ vars.AZURE_TENANT_ID }}" ] || [ -z "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_* variables 未設定のためスキップ"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.run == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Golden path（API ホップ切り分け・実 AI）
        if: steps.guard.outputs.run == 'true'
        run: |
          RG="$RG" DEPLOYMENT="$DEPLOYMENT" ./cicd/scripts/smoke-test/golden-path.sh

      # 永続化の実測 (#165 / ADR 0030)。「前回 run が保存したものが今も読めるか」を見て、
      # 新しいマーカーを次回 run のために置く。毎朝 1 回なので 24 時間のアイドルを挟む =
      # Functions Y1 のリサイクルを確実に経た後の実測になる (デプロイ直後のスモークでは
      # 絶対に捕まらない層)。AI は呼ばないのでコストは実質ゼロ。
      - name: 永続化プローブ（前回 run のデータが残っているか）
        if: steps.guard.outputs.run == 'true'
        run: |
          RG="$RG" DEPLOYMENT="$DEPLOYMENT" ./cicd/scripts/smoke-test/persistence-probe.sh

      - name: Setup Node 22
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      # UI 込みのシナリオテスト。フロント↔BFF の結線破壊はここでしか捕まらない。
      # e2e-live には UX プローブ (ux-probe.spec.ts — #123 M0) も含まれ、相談 4 往復の
      # 全応答文 + 区間レイテンシを probe-results/*.json に記録する
      - name: Golden path scenario + UX プローブ（UI 込み E2E・実環境）
        if: steps.guard.outputs.run == 'true'
        run: |
          OUTPUTS="$(az deployment group show -g "$RG" -n "$DEPLOYMENT" --query 'properties.outputs' -o json)"
          _val() { echo "$OUTPUTS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$1',{}).get('value',''))"; }
          export LIVE_APP_URL="https://$(_val staticSiteDefaultHostname)"
          export LIVE_BFF_URL="https://$(_val functionAppDefaultHostname)"
          export LIVE_ENTRA_CLIENT_ID="$(_val functionAuthEntraClientId)"
          export LIVE_ENTRA_TENANT_ID="$(_val functionAuthEntraTenantId)"
          export LIVE_BFF_TOKEN="$(az account get-access-token --scope "api://$LIVE_ENTRA_CLIENT_ID/.default" --query accessToken -o tsv)"
          # 実トークンをログ・trace への漏出から守る (レビュー指摘)
          echo "::add-mask::$LIVE_BFF_TOKEN"
          cd apps/frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e:live

      # UX プローブ記録の要約: レイテンシ閾値超過を warn annotation (#120「まず測る」) にし、
      # step summary に往復ごとの数値を出す。テスト自体はレイテンシで fail しない (仕分けは judge)
      - name: UX プローブ記録の要約 (レイテンシ warn + step summary)
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'EOF'
          import glob, json, os
          # **全記録を要約する** (#435: シナリオごとに 1 ファイル)。1 ファイルだけ読むと
          # もう片方のシナリオの warn が誰の目にも触れないまま run が緑になる
          files = sorted(glob.glob("apps/frontend/probe-results/*.json"))
          if not files:
              print("::notice::UX プローブ記録なし (プローブ手前で fail した可能性 — E2E ログ参照)")
              raise SystemExit(0)
          lines = ["## UX プローブ (#123 M0 / ADR 0022)"]
          for path in files:
              rec = json.load(open(path))
              scenario = rec["scenario"]["id"]
              lines += [
                  "",
                  f"### `{scenario}`",
                  f"- 完了 {rec['summary']['completedTurns']}/{rec['scenario']['plannedTurns']} 往復",
                  f"- send→応答表示: avg {rec['summary']['avgSendToReplyVisibleMs']}ms / max {rec['summary']['maxSendToReplyVisibleMs']}ms (1 往復目はコールドスタート込み)",
                  "",
                  "| turn | send→tRPC | send→表示 | TTS合成 | warn |",
                  "| --- | --- | --- | --- | --- |",
              ]
              for t in rec["turns"]:
                  tm = t["timings"]
                  tts = f"{tm['ttsRequestToResponseMs']}ms" if tm["ttsRequestToResponseMs"] is not None else "n/a"
                  lines.append(
                      f"| {t['index']} | {tm['sendToTrpcResponseMs']}ms | {tm['sendToReplyVisibleMs']}ms "
                      f"| {tts} | {len(t['warnings'])} |"
                  )
                  for w in t["warnings"]:
                      print(f"::warning title=UX probe {scenario} turn {t['index']} ({w['category']})::{w['message']}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print(f"summary written for {len(files)} record(s): {files}")
          EOF

      # 記録 JSON は artifact とデータブランチの両方に残す (ADR 0029 → ADR 0041)。
      # artifact = 障害調査用の一次情報。データブランチ data/ux-observations =
      # 毎朝の採点の入力 (ux-eval.yml と PM tick が読む)。採点ループは git の
      # fetch/push だけで閉じるので、artifact の可否に依存しない。
      #
      # 注: 以前ここには「agent セッションからは artifact をダウンロードできない」と
      # 書いてあったが、**これは 2026-08-13 時点では成り立たない**。ADR 0029 を書いた
      # 2026-08-09 の直後に `*.blob.core.windows.net` が egress 許可へ入っており
      # (#168 / docs/runbooks/ops-inspect.md)、再測定しないまま前提だけが残っていた。
      # この 1 行が #287 / #293 の調査を止めていた (失敗の証拠が目の前にあるのに
      # 「取れない」と信じて needs-human にしていた)。取り方は ops-inspect.md 参照。
      - name: UX プローブ記録を artifact として保存
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-probe-${{ github.run_id }}
          path: apps/frontend/probe-results/
          if-no-files-found: ignore
          retention-days: 90

      # 追記に失敗しても monitor 自体は赤くしない (この workflow の役目はゴールデンパスの
      # 死活であって記録の運搬ではない)。代わりに warning annotation を残し、翌朝の
      # ux-eval.yml が「材料なし」で赤くなることで二重に気づけるようにする。
      - name: UX プローブ記録をデータブランチへ追記 (採点の入力 / ADR 0041)
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          # **全記録を積む** (#435: シナリオごとに 1 ファイル)。`tail -1` で 1 本だけ
          # 拾っていた頃の形のままシナリオを増やすと、片方の記録が毎朝黙って捨てられ、
          # そのシナリオの採点行が一度も積まれないまま run は緑になる
          # nullglob: 記録が 1 件も無いときに `*.json` という**存在しないパス**を
          # 掴んで「封筒化に失敗」の warning を出さないため (原因を取り違える)
          shopt -s nullglob
          PROBE_FILES=(apps/frontend/probe-results/*.json)
          shopt -u nullglob

          ENVELOPES=()
          i=0
          for PROBE_JSON in "${PROBE_FILES[@]}"; do
            i=$((i + 1))
            OUT="/tmp/probe-envelope-$i.json"
            # 終了コードは必ずコマンド単体の直後に取る (PR #157 レビュー指摘と同じ理由)
            set +e
            python3 cicd/scripts/ux-probe/probe-record-comment.py envelope "$PROBE_JSON" > "$OUT"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::warning::プローブ記録を封筒化できませんでした (exit $rc): $PROBE_JSON — artifact から調査してください"
              continue
            fi
            ENVELOPES+=("$OUT")
          done

          if [ "${#ENVELOPES[@]}" -eq 0 ]; then
            echo "::notice::追記できる UX プローブ記録なし — データブランチへの追記をスキップ"
            exit 0
          fi

          # 追記の失敗も warning に丸める。`run:` は既定で `bash -eo pipefail` なので、
          # ここを裸で呼ぶと一時的な push 失敗で run 全体が failure になり、
          # ゴールデンパスの死活監視としては偽陽性になる。
          # (全 payload を 1 回の呼び出しで渡す = push も 1 回 — 競合リトライを増やさない)
          set +e
          ./cicd/scripts/ux-data/append-observation.sh "${ENVELOPES[@]}"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::warning::記録の追記に失敗しました (exit $rc / ${#ENVELOPES[@]} 件) — artifact から調査してください"
          else
            echo "データブランチへ ${#ENVELOPES[@]} 件の記録を追記した"
          fi

      # 落ちたときの一次情報。緑のときは不要。
      #
      # ⚠️ **trace / HAR を素で上げてはいけない** (ADR 0045)。この workflow は
      # deploy.yml と同じ `test:e2e:live` を **実 BFF アクセストークン**で走らせて
      # おり、`playwright.live.config.ts` の retain-on-failure が生成する trace には
      # そのトークンが入る。**このリポジトリは public** で artifact はサインイン済み
      # ユーザーなら誰でも取得できるため、ディレクトリを丸ごと上げると毎朝の失敗の
      # たびに実トークンが公開される (2026-08-12 の Codex レビューで発覚)。
      #
      # 上げるのは秘密ゼロを実測で確認したものだけ: スクリーンショット (画像) と
      # error-context.md (aria スナップショット)。playwright-report/ も trace を
      # 同梱しうるので**含めない**。
      - name: E2E の失敗証拠を残す (失敗時のみ / trace は除外)
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-live-report-${{ github.run_id }}
          path: |
            apps/frontend/test-results-live/**/*.png
            apps/frontend/test-results-live/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

      # trace 本体は公開鍵で暗号化してから残す (deploy.yml と同じ経路 / ADR 0045)。
      # 公開鍵が無い間は何も残さず warning を出す (fail closed)。
      - name: E2E の trace を公開鍵で暗号化して残す
        id: encrypt_trace
        if: failure() && steps.guard.outputs.run == 'true'
        env:
          PUBKEY: cicd/keys/e2e-artifacts.pub.asc
        run: |
          cicd/scripts/deploy/encrypt-e2e-traces.sh \
            "$PUBKEY" apps/frontend/test-results-live e2e-trace-enc

      - name: 暗号化した trace をアップロードする
        if: failure() && steps.guard.outputs.run == 'true' && steps.encrypt_trace.outcome == 'success' && hashFiles('e2e-trace-enc/**/*.gpg') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-live-trace-${{ github.run_id }}
          path: e2e-trace-enc/**/*.gpg
          retention-days: 14
          if-no-files-found: error

      # 落ちたことに気づける唯一の経路。別の見張りを置かず、落ちた当人が Issue を立てる
      # (ADR 0035 D2)。緑になれば同じ Issue を自分で閉じるので、Issue 一覧が現在の状態を表す。
      - name: 失敗を Issue にする / 復旧したら閉じる
        if: always()
        uses: ./.github/actions/report-failure
        with:
          job-status: ${{ job.status }}
          # OIDC guard で skip された run は 1 ホップも叩いていない
          work-ran: ${{ steps.guard.outputs.run == 'true' }}
          what: "**ゴールデンパス (認証 → 対話 → 音声 → 抽出 → 一覧) が実環境で通っていません。** ユーザーが触ると失敗する状態です。"
