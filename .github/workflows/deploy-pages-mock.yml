name: deploy-pages-mock

# Phase D のモック UI を GitHub Pages に公開するデモ用ワークフロー。
# VITE_USE_MOCK=true（BFF 不要・認証スキップ）+ サブパス base でビルドし、
# gh-pages ブランチへ publish する。公開後の URL: https://<owner>.github.io/mind-inbox/
#
# 初回のみ: リポジトリ Settings → Pages → Source を "Deploy from a branch" /
#           Branch: gh-pages / (root) に設定する（ブランチ deploy なので環境保護に縛られない）。

on:
  push:
    branches: [claude/phase-d-types-mock-gc20q0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-mock
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        run: pnpm --dir apps/frontend install --frozen-lockfile

      # frontend の tsc -b は tsconfig.app.json で ../bff/src/trpc/router.ts も型検査するため、
      # BFF の型依存（zod / @trpc/server / @azure/functions）が必要。
      - name: Install bff deps (for shared trpc types)
        run: npm --prefix apps/bff ci

      - name: Build (mock + subpath)
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE: "/mind-inbox/"
        run: pnpm --dir apps/frontend run build

      - name: SPA fallback (404 = index)
        run: cp apps/frontend/dist/index.html apps/frontend/dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/frontend/dist
          publish_branch: gh-pages
          force_orphan: true
