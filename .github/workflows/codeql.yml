# SAST (CodeQL) — security-sweep が「カバー外」と自認していた層 (Issue #313 / #316)。
#
# 役割分担 (重複させない):
#   - security-sweep (週次)  = SCA (npm/pnpm/pip-audit の既知 CVE) + secrets (gitleaks)
#     → **依存とコミット済みの秘密**を見る。自分たちが書いたコードの欠陥は見ない
#       (`cicd/scripts/security-sweep/sweep.py` の UNCOVERED #1 に「SAST 未導入」と明記)
#   - この workflow             = SAST (injection / SSRF / path traversal / 危険な eval 等)
#     → **自分たちが書いたコード**のデータフローを見る。依存の CVE は見ない
#   両者は対象が排他なので、sweep 側の UNCOVERED #1 を消せるのはこちらの導入だけ。
#
# **advisory であって門ではない** (ADR 0038 が `@codex security review` に採った方針と同じ):
#   この workflow を **required check にしない**。SAST は偽陽性が出る道具で、実績を
#   見ないうちに必須にすると「マージを止める理由」ではなく「無視される赤」になる。
#   門にするかどうかは数週分の検出実績を見て PO が決める (ADR 0036 の driver
#   「門を重くしない」)。code scanning の alert は Security タブに残る。
#
# PR 所要時間 (ADR 0036 の driver):
#   PR では **差分に含まれる言語だけ**を解析する (languages job)。TS しか触っていない
#   PR で Python の DB 構築 (数分) を待たない。フルスキャン (両言語) は push(main) /
#   週次 schedule に寄せる。差分が取れなかった場合は**広い方 (両言語) に倒す** —
#   取りこぼしを静かに緑にしない (security-sweep の「実行できず ≠ 0 件」と同じ規律)。
#
# 前提: **このリポジトリは public なので CodeQL は無料**。ただし alert の表示には
#   Settings → Code security → Code scanning が有効である必要がある (needs-human)。
name: codeql

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 19 * * 0" # 月曜 04:00 JST (security-sweep の 06:30 とずらす)
  workflow_dispatch:

# merge_group は**意図的に入れていない** — required check にしない方針 (上記) なので
# queue に status を出す必要が無く、入れると queue の滞留時間だけが伸びる。

# 既定はゼロ。job ごとに最小権限を宣言する (review-gate.yml と同じ流儀)。
permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  # PR は連続 push で古い解析を捨ててよい。main / schedule は捨てない
  # (main の解析結果が PR alert の差分計算のベースラインになる)。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR の差分から解析対象言語を決める (フルスキャンは PR 以外)。
  # 差分は API で取る — checkout も PR 側コードの実行も要らない。
  languages:
    name: 解析する言語を決める
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: 差分から対象言語を決める
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          BOTH='["javascript-typescript","python"]'

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "matrix=$BOTH" >> "$GITHUB_OUTPUT"
            echo "PR 以外 ($EVENT_NAME) はフルスキャン: $BOTH"
            exit 0
          fi

          # 失敗しても落とさない (空文字 → 下のフォールバックで両言語に倒れる)
          FILES="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                     --jq '.[].filename' 2>/dev/null || true)"

          LANGS=""
          if printf '%s\n' "$FILES" | grep -qE '\.(ts|tsx|js|jsx|mjs|cjs)$'; then
            LANGS='"javascript-typescript"'
          fi
          if printf '%s\n' "$FILES" | grep -qE '\.py$'; then
            if [ -n "$LANGS" ]; then LANGS="${LANGS},"; fi
            LANGS="${LANGS}\"python\""
          fi

          if [ -z "$LANGS" ]; then
            # paths フィルタを通ったのに言語を判別できない = 差分取得に失敗した公算。
            # 「対象なし」で緑にせず、広い方に倒す。
            echo "::warning::PR の差分から言語を判別できなかったため両言語を解析する"
            echo "matrix=$BOTH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matrix=[$LANGS]" >> "$GITHUB_OUTPUT"
          echo "差分に含まれる言語だけを解析する: [$LANGS]"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # SARIF を code scanning alert として登録するため (fork PR では token が
      # read-only に落ちるので upload はスキップされる — 解析自体は走る)
      security-events: write
      # CodeQL が同一 repo の過去 run を参照するのに使う
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: CodeQL を初期化
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # TS も Python もインタプリタ言語 — ビルドせずに DB を作れる。
          # autobuild を回すと依存インストールで数分増えるうえ、PR 由来の
          # ビルドスクリプトを走らせることになる (test.yml が既に負っている
          # 信頼境界をここでも重複して負わない)。
          build-mode: none

      - name: 解析する
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
          # fork PR は GITHUB_TOKEN が read-only なので SARIF upload が 403 で
          # **落ちる** (codeql-action は warning を出したうえで throw する)。
          # 解析自体は走らせたまま upload だけ落とす — 「fork PR だから赤」を
          # 常態化させない (赤が意味を失うのを避ける)。
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}

  # 落ちたことに気づける唯一の経路 (ADR 0035 D2)。PR の失敗は PR 上で見えるので
  # 対象外にし、**無人で回る経路 (push(main) / schedule / dispatch) だけ**を見る。
  # PR イベントの run にはこの job の issues:write を渡さない (review-gate と同じ
  # 権限分離 — PR 側から定義が来る run に書き込み権限を置かない)。
  report:
    name: 失敗を Issue にする / 復旧したら閉じる
    needs: [languages, analyze]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/report-failure
        with:
          # languages が落ちれば analyze は skipped になる — その skipped を
          # 「異常なし」に丸めない (decide.py は未知の状態を報告側に倒す)
          job-status: ${{ needs.analyze.result }}
          # schedule/push は解析が最後まで通ったときだけ「仕事が済んだ」
          work-ran: ${{ needs.analyze.result == 'success' }}
          what: "**SAST (CodeQL) が実行できていません。** 自分たちが書いたコードの injection / SSRF 等が検出されない状態が続きます (依存 CVE は security-sweep が別に見ています)。"
