name: claude-review

# 開発セッションとは別軸の「審査役 (LLM-as-a-judge)」。
# PR の作成・更新ごとに Claude が diff をレビューし、1 本の sticky サマリ
# コメント + 重要箇所の inline comment を残す。
# 審査基準は .github/claude/review-rubric.md (rubric-as-truth)。
# テストの pass/fail・lint・build は test.yml が担当し、ここでは重複させない。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# 同じ PR への連続 push では古いレビューをキャンセルしてコストを抑える。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    name: claude judge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 公開リポジトリ向けガード:
    #  - draft はレビューしない (cost 抑制)
    #  - fork からの PR では走らせない。fork PR には Secret が渡らない (GitHub 仕様) ため
    #    認証が空で必ず失敗し、外部 PR に赤 X を付けるだけになる。同一リポジトリの
    #    ブランチ (自分 / collaborator) の PR にのみ反応させる。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max サブスク枠を使い従量課金を避ける (claude setup-token で発行)。
          # API 従量課金で回したい場合は次行を anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に差し替える。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # judge は毎 PR 走るのでコスト重視で Sonnet を既定にする。
          # 深いレビューが要る場合は claude-opus-4-8 に上げてよい。
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            あなたは Mind Inbox の PR レビュアー (judge) です。実装はしません。

            対象: repo=${{ github.repository }} / PR #${{ github.event.pull_request.number }}

            手順:
            1. `.github/claude/review-rubric.md` を読み、その役割・3 軸・Severity・出力ルールに**厳密に**従う。
            2. `gh pr diff ${{ github.event.pull_request.number }}` で変更内容を取得する。
            3. `gh pr view ${{ github.event.pull_request.number }} --json title,body,files` で
               PR 本文 (テンプレ記入内容) とファイル一覧を取得し、軸 C の整合チェックに使う。
            4. 必要なら関連ファイル (戦略 doc・実装・テスト) を Read/Grep で確認する。
            5. レビュー結果を rubric の「出力ルール」どおりにまとめる。

            コメント投稿:
            - サマリは 1 本に集約する。本文先頭に必ず `<!-- claude-pr-review -->` を入れる。
            - 既存の同マーカーコメントの有無を
              `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`
              で確認し、あれば
              `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=...` で**編集**、
              なければ `gh pr comment ${{ github.event.pull_request.number }} --body ...` で新規作成する。
            - blocker / major で行が特定できるものだけ inline comment
              (mcp__github_inline_comment__create_inline_comment) を付ける。
