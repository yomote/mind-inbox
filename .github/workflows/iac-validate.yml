name: iac-validate

# Bicep のコンパイル検証（構文・型・参照エラー）。
# ローカルの agent 環境では bicep CLI の取得が egress ポリシーで塞がれるため、
# GitHub runner（bicep 同梱・プロキシ外）でビルドして IaC 変更を自動検証する。
# 注: これは `az deployment ... what-if`（実 Azure 差分）ではなくコンパイル検証まで。

on:
  pull_request:
    paths:
      - "cicd/iac/**"
      - "cicd/modules/**"
      - "cicd/bicepconfig.json"
      # 層タグの照合は bicep 側と撤収ガード側の**両方**が入力なので、
      # ガードだけを触った PR でもここを走らせる (片方だけ変えて素通りするのを防ぐ)。
      - "cicd/scripts/env/**"
      - ".github/workflows/iac-validate.yml"
  push:
    branches: [main]
    paths:
      - "cicd/iac/**"
      - "cicd/modules/**"
      - "cicd/bicepconfig.json"
      - "cicd/scripts/env/**"

permissions:
  contents: read

jobs:
  bicep-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # main-entra.bicep は Microsoft Graph Bicep 拡張 (`extension microsoftGraphV1`) を使う。
      # 拡張の構文には Bicep v0.36.1 以降が要るので、同梱版が古い場合に備えて upgrade する。
      # https://learn.microsoft.com/en-us/graph/templates/bicep/quickstart-install-bicep-tools
      - name: az bicep version
        run: |
          az bicep install || true
          az bicep upgrade || true
          az bicep version

      - name: Build all bicep entrypoints
        run: |
          set -euo pipefail
          for f in cicd/iac/main-mgmt.bicep cicd/iac/main-bootstrap.bicep cicd/iac/main-config.bicep cicd/iac/main-entra.bicep; do
            echo "==> az bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null
          done
          echo "✅ bicep build OK（main-bootstrap は modules/bootstrap-core.bicep も含めて検証）"

      # 層タグ (mindInboxLayer=management) は「bicep が刻む値」と「撤収ガードが探す値」の
      # 2 箇所に分かれている。**片方だけ変えても両方のテストが緑のまま通る**ので、
      # 突き合わせをここで機械にする (ズレると管理系リソースが撤収で黙って消える)。
      #
      # 同じ検査の bicep ソース側は `npm run test:scripts` でも走るが、
      # **コンパイル後の ARM を見る層は bicep が要る** ので、bicep のあるこの job で走らせる
      # (test.yml のランナーには bicep が入っていない)。
      - name: 層タグと撤収ガードの定数が一致するか（ARM まで評価して照合）
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          out="$(python3 -m pytest cicd/scripts/env/test_mgmt_layer_tag_contract.py -q -rs 2>&1)"
          echo "$out"
          # bicep のあるこの job で skip されたら「未検証のまま緑」になる。落とす。
          if grep -qi 'skipped' <<<"$out"; then
            echo "::error title=層タグ照合が skip された::bicep が見えていないため ARM 照合が未検証のまま緑になりました"
            exit 1
          fi
