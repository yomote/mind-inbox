# 構成図 (docs/cicd/iac/infra_arch.svg / infra_arch_resource_roles.md) を実環境から再生成する。
#
# なぜ自動化するか: これらは viz-structure.sh の生成物だが、実行に Azure アクセスが要るため
# 「誰も手元で回さない → 静かに陳腐化する」状態だった (2026-08 時点で ACR 廃止・SQL 既定オフ・
# Speech 追加が未反映)。Azure 認証は deploy.yml と同じ OIDC で Actions から取れるので、
# ローカル実行を前提にする理由が無い。
#
# 反映方法: 差分があるときだけ PR を開く (main へ直 push しない)。
#   「いつの間にかインフラが変わっていた」が、レビュー可能な差分として人の目に入る。
#
# 運用手順 (止め方 / 頻度変更 / トラブルシュート): docs/runbooks/refresh-infra-diagram.md

name: refresh-infra-diagram

on:
  schedule:
    - cron: "0 20 * * 0" # 日 20:00 UTC = 毎週月曜 05:00 JST
  workflow_dispatch:

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: write # 生成物を載せたブランチを push する
  pull-requests: write # 差分があるとき PR を開く

concurrency:
  group: refresh-infra-diagram
  cancel-in-progress: false

env:
  RGS: rg-dev-mind-inbox
  BRANCH: chore/refresh-infra-diagram

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # OIDC 未設定 (repo Variables 未登録) の間は、誤実行を赤くせず skip (deploy.yml と同じ)。
      - name: Guard — OIDC 設定済みか
        id: guard
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OIDC 未設定 (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID のいずれか空)。docs/runbooks/azure-oidc-cd-setup.md で3変数すべてを Variables に登録してください。今回はスキップします。"
          fi

      # viz-structure.sh が要求する 4 つのうち graphviz だけ runner に無い (az / jq / python3 は同梱)。
      - name: graphviz を入れる
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.run == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az graph` は拡張。未導入だと viz-structure.sh がクエリ段で落ちる。
      - name: resource-graph 拡張を入れる
        if: steps.guard.outputs.run == 'true'
        run: az extension add --name resource-graph --only-show-errors

      # アイコンは repo に commit してある (配布元 CDN 廃止のため。詳細は icons/README.md)。
      # ダウンロードはしない — 取得の成否ではなく「図にアイコンが入るか」だけが問題なので、
      # 材料が揃っているかをここで確かめる。
      - name: アイコンが揃っているか
        if: steps.guard.outputs.run == 'true'
        run: |
          COUNT=$(find cicd/scripts/viz-structure/icons -maxdepth 1 -name '*.png' | wc -l)
          echo "アイコン: ${COUNT} 個"
          [ "$COUNT" -gt 0 ] || { echo "::error::アイコンが 1 個も無い。アイコン無しの図で既存の図を上書きしない"; exit 1; }

      - name: 構成図を再生成
        if: steps.guard.outputs.run == 'true'
        run: |
          cicd/scripts/viz-structure/viz-structure.sh \
            --subs "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            --rgs "$RGS"

      # 「取得できたか」ではなく「**図にアイコンが入ったか**」で判定する。
      # 2026-08-09: 取得ステップを continue-on-error にしていたため、CDN 廃止で
      # アイコンが 0 個になったことに誰も気づかず、19 個入りの図を 0 個の図で
      # 上書きした。自動更新が成果物を劣化させることを禁止する。
      - name: 図にアイコンが入っているか
        if: steps.guard.outputs.run == 'true'
        run: |
          EMBEDDED=$(grep -c 'data:image/png;base64' docs/cicd/iac/infra_arch.svg || true)
          echo "図に埋め込まれたアイコン: ${EMBEDDED} 個"
          if [ "$EMBEDDED" -eq 0 ]; then
            git checkout -- docs/cicd/iac/ || true
            echo "::error::再生成した図にアイコンが 1 つも入っていない。**既存の図は変更せず中止する** (人間の可読性が落ちるため)。icons/ と graphviz の IMG 解決を確認すること"
            exit 1
          fi

      # 未追跡ファイルも拾うため --porcelain (git diff だけだと新規生成物を見落とす)。
      - name: 差分を判定
        if: steps.guard.outputs.run == 'true'
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- docs/cicd/iac/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::構成図に差分なし。インフラは docs と一致しています。"
            exit 0
          fi

          # 2026-08-10: SVG には生成時刻が焼き込まれているため、**構成が 1 つも変わって
          # いなくても毎週 PR が開く** (#193 は実際に生成時刻 1 行だけの PR だった)。
          # 中身の無い PR は「見なくていい PR」を教育してしまい、本当に見るべき差分も
          # 素通りする。生成時刻だけの差分は差分として数えない。
          # ヒアドキュメントは YAML のブロックスカラー内で終端を字下げできないので使わない
          git diff --name-only -- docs/cicd/iac/ > /tmp/changed.txt
          SIGNIFICANT=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -n "$(git diff -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                        | grep -v 'Generated(UTC)')" ]; then
              SIGNIFICANT=1
              break
            fi
          done < /tmp/changed.txt
          # 新規ファイル (未追跡) は常に有意な差分として扱う
          if [ -n "$(git ls-files --others --exclude-standard -- docs/cicd/iac/)" ]; then
            SIGNIFICANT=1
          fi

          if [ "$SIGNIFICANT" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::差分は生成時刻だけ。構成は docs と一致しているので PR は開かない。"
            git checkout -- docs/cicd/iac/ || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- docs/cicd/iac/
          fi

      - name: 差分があれば PR を開く
        if: steps.guard.outputs.run == 'true' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同名ブランチは毎回作り直す。載せるのは常に「今の実環境」だけでよく、
          # 履歴は PR のコミット一覧に残る。
          git checkout -B "$BRANCH"
          git add docs/cicd/iac/
          git commit -m "chore(docs): 構成図を実環境から再生成 (自動)"
          git push -f origin "$BRANCH"

          COMPARE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"

          # 既に開いている PR があれば、上の push で反映済み。二重に立てない。
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "::notice::既存 PR に反映しました。"
            exit 0
          fi

          cat > /tmp/pr-body.md <<BODY
          ## Summary

          - **目的**: \`docs/cicd/iac/\` の構成図と実環境のズレを解消する
          - **変更**: refresh-infra-diagram が Azure Resource Graph から再生成した生成物
          - **影響**: docs のみ。アプリ・IaC の変更なし
          - **リスク**: なし
          - **結論**: **マージ可能** — ただし**差分の中身は確認すること**。想定外のリソース増減が写っている場合、それは図の問題ではなく**インフラ側の変化**

          ## Changes

          - \`docs/cicd/iac/infra_arch.svg\`
          - \`docs/cicd/iac/infra_arch_resource_roles.md\`

          ## Verification

          | Check | Result |
          | --- | --- |
          | Unit / contract | 対象外 |
          | E2E | 対象外 |
          | Live verification | PASS — 実 Azure (Resource Graph) から取得 |
          | UI 確認 | 対象外 |

          ## Review focus

          - 差分に**知らないリソースの増減**が無いか。あればインフラ側を調べる

          ## Links

          - Actions: $RUN_URL

          ---

          _Generated by [Claude Code](https://claude.ai/code)_
          BODY

          # PR 作成はリポジトリ設定 (Settings → Actions → General → Workflow permissions →
          # "Allow GitHub Actions to create and approve pull requests") に依存する。
          # off だと workflow の permissions では越えられない。その場合でも
          # **ブランチは push 済みで差分は失われていない**ので、赤にせず比較 URL を案内して終わる
          # (毎週 1 回の赤は「またか」と読み流されるようになり、本当の失敗を隠すため)。
          if ! gh pr create -R "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base main \
            --title "chore(docs): 構成図を実環境から再生成 (自動)" \
            --body-file /tmp/pr-body.md 2> /tmp/pr-create.err; then
            cat /tmp/pr-create.err
            # 文言の揺れに耐えるよう、変わりにくい中核だけを大小無視で見る。
            # `gh` はこの拒否に固有の終了コードを返さないため文字列判定しかない。
            # 文言が変わって外れた場合は下の ::error:: 経路に落ち、**赤 + 比較 URL** になる
            # (静かに壊れるのではなく、気づける形で劣化する)。
            # "Resource not accessible by integration" は意図的に拾わない —
            # それは workflow 側の permissions 不足 = こちらのバグなので赤で気づきたい。
            if grep -qiE "not (permitted|allowed) to (create|approve)" /tmp/pr-create.err; then
              echo "::warning::差分は \`$BRANCH\` に push 済みですが、PR の自動作成がリポジトリ設定で拒否されました。手動で開いてください: $COMPARE_URL (恒久対応は Settings → Actions → General → Workflow permissions で 'Allow GitHub Actions to create and approve pull requests' を有効化 / docs/runbooks/refresh-infra-diagram.md)"
              exit 0
            fi
            echo "::error::PR 作成に失敗しました。差分は \`$BRANCH\` にあります: $COMPARE_URL"
            exit 1
          fi
