# 「いまの状況」ページを GitHub の実データから組み立て、gh-pages の /status/ に置く。
#
# なぜ必要か (2026-08-10 の PO 指摘):
#   「今何が動いていて何が問題か」がぱっと分かる場所が無かった。セッションで作る HTML は
#   作った瞬間に古くなる静的スナップショットで、手で書く表は腐る (docs に置いた台帳が
#   実際そうなった)。**状態を持たず毎回作り直す**ことで、どちらの失敗も避ける。
#
# 置き場所: gh-pages の **/status/ 配下だけ**。ルートには 2026-07 のフロント配信物が
#   残っているので触らない。
#
# 運用手順 (URL / 止め方 / 監視項目の足し方): docs/runbooks/status-page.md

name: status-page

on:
  schedule:
    - cron: "10 22 * * *" # 07:10 JST — golden-path-monitor (07:00) の直後
  push:
    branches: [main]
  workflow_run:
    # 監視対象 (watchers.json で critical / 定期のもの) の完了で描き直す。
    # ux-eval (08:20 JST) は 07:10 の schedule より後に走るため、ここに無いと
    # 赤くなっても翌朝まで前日の緑が表示され続ける (Codex レビュー指摘 / PR #224)
    workflows: [deploy, golden-path-monitor, ux-eval, debt-check]
    types: [completed]
  workflow_dispatch:

# permissions は **書いた瞬間に、書かなかったものが none になる**。
# 新しい API を叩くようになったらここに 1 行足すこと — 足し忘れると本番だけ
# 403 になり、ページは落ちずに「未検証」を並べる (静かに情報が消える / PR #281)。
permissions:
  contents: write # gh-pages に push する
  actions: read # 他ワークフローの run 履歴 / run の jobs (実デプロイの痕跡) を読む
  issues: write # 落ちたら自分で Issue を立てる (ADR 0035 D2)
  pull-requests: read # 「進行中」の open PR 一覧と変更ファイル (#280)
  statuses: read # 各 PR の review-gate (commit status) の色 (#280)

concurrency:
  group: status-page
  cancel-in-progress: true # 常に最新だけあればよい

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # UX トレンド (ADR 0041 D6) の描画元。ブランチが無くても落とさない —
      # build.py が「未検証」として出す (取れなかったを異常なしに見せない)
      - name: UX 観測データブランチを取得 (トレンド描画用)
        run: |
          if git ls-remote --exit-code --heads origin data/ux-observations >/dev/null 2>&1; then
            git fetch origin data/ux-observations
            git worktree add /tmp/ux-data FETCH_HEAD
            echo "UX_DATA_DIR=/tmp/ux-data" >> "$GITHUB_ENV"
          else
            echo "::warning::data/ux-observations がまだ無いため UX トレンドは未検証表示になります"
          fi

      - name: ページを組み立てる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 cicd/scripts/status-page/build.py out/

      # 生成が空・極端に短いときは push しない。壊れたページで上書きすると
      # 「見に行ったら白紙」になり、赤を見落とす (静かに壊さない)。
      - name: 生成物を検査する
        run: |
          bytes=$(wc -c < out/index.html)
          echo "index.html = ${bytes} bytes"
          if [ "$bytes" -lt 2000 ]; then
            echo "::error::生成物が小さすぎます (${bytes} bytes)。push を中止します"
            exit 1
          fi

      - name: gh-pages の /status/ を差し替える
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/pages origin/gh-pages
          rm -rf /tmp/pages/status
          mkdir -p /tmp/pages/status
          cp out/index.html /tmp/pages/status/index.html
          cd /tmp/pages
          git checkout -B gh-pages
          git add status
          if git diff --cached --quiet; then
            echo "変化なし — push しません"
            exit 0
          fi
          git commit -q -m "status: ${GITHUB_SHA:0:7} 時点の状況ページ"
          git push origin gh-pages

      - name: URL を出す
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          echo "### いまの状況" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${owner}.github.io/${name}/status/" >> "$GITHUB_STEP_SUMMARY"

      # 落ちたことに気づける唯一の経路。別の見張りを置かず、落ちた当人が Issue を立てる
      # (ADR 0035 D2)。緑になれば同じ Issue を自分で閉じるので、Issue 一覧が現在の状態を表す。
      - name: 失敗を Issue にする / 復旧したら閉じる
        if: always()
        uses: ./.github/actions/report-failure
        with:
          job-status: ${{ job.status }}
          # このワークフローは guard を持たず、success なら必ず生成まで走っている
          work-ran: "true"
          # このワークフローは cancel-in-progress: true で 4 系統のトリガーを持つため、
          # **自己中断 (cancelled) が正常運用**。ここを障害扱いにすると、中断のたびに
          # Issue が立って「Issue 一覧が現在の状態を表す」を自分で壊す (レビュー指摘)。
          cancelled-is-failure: "false"
          what: "**状況ページの生成が失敗しました。** ページが古い状態で止まっているため、そこの緑は当てになりません。"
