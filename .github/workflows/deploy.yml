name: deploy

# 常設 dev への CD（ADR 0013。ADR 0009 のオンデマンド teardown を supersede）。
# - main マージ: 常設 dev へ自動デプロイ（固定 URL に最新が載る）
# - 手動 up: 環境を立ち上げる / 作り直す（IaC + コンテナ + BFF/frontend）
# - 手動 down: cleanup-env.sh で撤収（一時的に畳みたいとき用。常設運用では通常使わない）
#
# 夜間 schedule の自動 teardown は **廃止**（ADR 0013）。待機コストの主因（SQL / ACR /
# SWA Standard）を撤去して待機ほぼ ¥0 になったため、「消し忘れ」を毎晩潰す必要がなくなった。
# 代わりの安全網は **予算アラート**（#69 で IaC 化。閾値超過でメール通知）。
#
# 認証は Azure OIDC（federated credential）= 保存シークレット0。
# 事前設定（一度きり）: docs/runbooks/azure-oidc-cd-setup.md を参照し、
# リポジトリ Variables に AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID を設定する。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "up = 立ち上げ / down = 撤収(¥0化)"
        type: choice
        options: [up, down]
        required: true
      environment:
        description: 対象環境
        type: choice
        options: [dev]
        default: dev
        required: true
      voicevox:
        description: "VOICEVOX tier（up 時のみ）: cpu=速く安く / gpu=喋り速い"
        type: choice
        options: [cpu, gpu]
        default: cpu
        required: true

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: read
  actions: read # IMAGE_TAG 解決で build-images の run 履歴を読む (#107)
  issues: write # 落ちたら自分で Issue を立てる (ADR 0035 D2)

concurrency:
  # 自動デプロイ / 手動 up / 手動 down を RG 単位で「同一グループ」に入れて直列化する。
  # これは意図的: 別グループにすると deployment 中に group delete が走って RG が壊れる。
  # cancel-in-progress: false — 走行中のデプロイを途中で切ると中途半端な状態が残るため、
  # 連続 push でもキューイングして順に流す。
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 初回 up は ~15〜30 分（IaC + Container Apps 反映）。image は ghcr 事前ビルド済み(#67)を
    # 差し替えるだけでデプロイ経路のビルドは無い。ネット遅延・再試行の余裕を見て 90。
    timeout-minutes: 90
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RG: rg-${{ github.event.inputs.environment || 'dev' }}-mind-inbox
      DEPLOYMENT: main-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OIDC 未設定（repo Variables 未登録）の間は、誤実行を赤くせず skip。
      - name: Guard — OIDC 設定済みか
        id: guard
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # 3 変数すべて揃って初めて run=true。partial 登録を後段 azure/login まで持ち越さない。
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OIDC 未設定（AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID のいずれか空）。docs/runbooks/azure-oidc-cd-setup.md で3変数すべてを Variables に登録してください。今回はスキップします。"
          fi

      # main マージの自動デプロイは **明示的に有効化するまで動かない**。
      # 理由: 認可 (#69 の Entra アプリ登録 + applyFunctionAuthLockdown) が未設定のまま
      # 自動デプロイを回すと、認可の無いアプリが公開 URL に自動で出続ける。
      # docs/runbooks/entra-spa-auth-and-budget.md を終えてから
      # リポジトリ Variables に AUTO_DEPLOY_ENABLED=true を設定して解禁する。
      # 手動 up / down はこのゲートの対象外（意図が明示されているため）。
      - name: Guard — 自動デプロイが解禁されているか
        id: autodeploy
        if: github.event_name == 'push'
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED }}
        run: |
          if [ "$AUTO_DEPLOY_ENABLED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::自動デプロイは未解禁のため skip しました。認可の設定 (docs/runbooks/entra-spa-auth-and-budget.md) を終えたあと、リポジトリ Variables に AUTO_DEPLOY_ENABLED=true を設定すると main マージで常設 dev へ自動反映されます。"
          fi

      # 状況ページ (cicd/scripts/status-page) が「この run はデプロイ経路に入ったか」を
      # 読むための痕跡。**失敗し得る処理より前**に置くのが要点 — Azure login や
      # IMAGE_TAG 解決で落ちると後続の `Provision + deploy (up)` は skipped になり、
      # 「試みて失敗した」と「そもそも走らなかった (guard skip)」が区別できなくなる。
      # 区別できないと、デプロイ赤なのに状況ページが緑に見える (PR #281)。
      # **ステップ名を変えたら product_status.py の MARKER_STEP も直すこと。**
      # 実行内容は echo だけ (デプロイの挙動は変えない)。条件は下のデプロイ step 群と同一。
      - name: デプロイ経路に入った (marker)
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: echo "deploy path entered (marker for status-page)"

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.run == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---- DOWN: 手動 down のみ ----
      # 夜間 schedule の自動 teardown は ADR 0013 で廃止（常設・待機ほぼ ¥0 になったため）。
      # 一時的に畳みたいときの手段としてスクリプトと手動 down は残す。
      # cleanup-env.sh は冪等（内部 rg_exists ガードで RG 不在なら group delete を skip）。
      # `|| true` は付けない（purge 失敗等の本当のエラーは赤くして気づきたいため）。
      # ADR 0046 D6 以降、soft-delete の purge は既定 off。よって down のあとの up が
      # 名前衝突（"already exists in soft-deleted state"）で落ちることがある。
      # それは想定内の症状で、手当ては purge フラグを立てた再 down（下のログが案内する）。
      - name: Tear down (cleanup-env)
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'down'
        run: |
          echo "Tearing down $RG ..."
          RG="$RG" ./cicd/scripts/env/cleanup-env.sh

      # ---- UP: 手動 up、または main マージの自動デプロイ（解禁済みのとき） ----
      # provision.sh は冪等なので、初回構築と以後の反映を同じ 1 本で回す
      # （ADR 0013「既存 IaC / スクリプトを唯一の真実として再利用」）。
      - name: Setup Node 22
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Install deploy tooling (swa CLI, zip, unzip)
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: |
          npm install -g @azure/static-web-apps-cli
          # zip / zipinfo は ubuntu-latest に入っている想定。無い時だけ apt（毎回の update ~30-60s を回避）。
          # zipinfo は unzip パッケージ同梱。BFF の zip に symlink が混ざっていないかの検査に使い、
          # 無いと deploy-backend.sh が「検査できない」として落ちる（#420）。
          command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }
          command -v zipinfo >/dev/null || { sudo apt-get update && sudo apt-get install -y unzip; }

      # :latest 差し替えは ARM 的にテンプレート変更なし → 新 revision を作らない no-op (#107)。
      # ghcr 側で latest の実体が進んでいても Container Apps は据え置きのままになるため、
      # 「直近の build-images 成功 run の head SHA」から不変タグ sha-<sha> を解決して渡す。
      # 注: build-images は apps/services/** 変更時のみ走るので、デプロイ対象 commit と
      # image の commit は一致しないことがある（「最後にビルドされた sha」が正）。
      - name: Resolve IMAGE_TAG（直近 build-images 成功 run の SHA）
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        timeout-minutes: 40 # build-images (timeout 30 分) の完了待ちを含むため
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh の API 呼び出しは一過性で落ちうる（5xx / rate limit / ネットワーク）。
          # 素で書くと set -e で gh の生エラーのまま step が死に、「何が起きたのか」が
          # ログを掘らないと分からない。rc を自前で見て、意図したメッセージに翻訳する。
          GH_ERR="$(mktemp)"
          gh_json() { # $1=説明, 以降=gh の引数。成功時は stdout に結果、失敗時は rc!=0
            local label="$1"; shift
            if ! gh "$@" 2>"$GH_ERR"; then
              echo "::warning::$label に失敗しました: $(head -c 200 "$GH_ERR" | tr '\n' ' ')" >&2
              return 1
            fi
          }

          # 1) この commit 自身が build-images をトリガーしていれば完了を待つ。
          #    待たないと「一つ前の image」を載せてしまい、それが当日最後の push だと
          #    新 image が永遠に届かない（#107 と同じ据え置きが形を変えて残る）。
          #    ここが取れなくても致命ではない（2 の解決に進めば直近の成功 image は載る）ので
          #    warning に留める。
          RUN_ID="$(gh_json "この commit の build-images run 検索" \
            run list -R "$GITHUB_REPOSITORY" --workflow build-images.yml \
            --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          if [ -n "$RUN_ID" ]; then
            STATUS="$(gh_json "build-images run #$RUN_ID の状態取得" \
              run view -R "$GITHUB_REPOSITORY" "$RUN_ID" --json status --jq '.status' || true)"
            # 取得できなかった場合は completed と決めつけず、待つ側に倒す（待ちすぎても
            # 遅くなるだけだが、待たない側に倒すと古い image を載せてしまう）。
            if [ "$STATUS" != "completed" ]; then
              echo "この commit の build-images run #$RUN_ID (${STATUS:-状態不明}) の完了を待ちます..."
              # 失敗/キャンセル（新しい push による cancel-in-progress 含む）でもデプロイ自体は
              # 止めない: build の赤は build-images 側で見え、ここでは直近の成功 image で続行する。
              gh run watch -R "$GITHUB_REPOSITORY" "$RUN_ID" --exit-status \
                || echo "::warning::build-images run #$RUN_ID が成功しませんでした（または監視に失敗）。直近の成功 run の image で続行します。"
            fi
          fi

          # 2) 直近の build-images 成功 run の head SHA → sha-<full-sha> タグ。
          #    ここは代替手段が無いので、取得失敗も「成功 run ゼロ」も fail にする。
          #    :latest へのフォールバックはしない（それこそが #107 の no-op を招く）。
          if ! SHA="$(gh_json "直近の build-images 成功 run の取得" \
            run list -R "$GITHUB_REPOSITORY" --workflow build-images.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"; then
            echo "::error::build-images の run 一覧を取得できず IMAGE_TAG を解決できませんでした（GitHub API の一過性障害 / permissions: actions: read の不足）。上の warning の理由を確認し、再実行してください。"
            exit 1
          fi
          if [ -z "$SHA" ]; then
            echo "::error::build-images の成功 run が 1 件も見つかりません。ghcr に image が無い可能性が高いため、:latest へのフォールバックはしません（no-op どころか初回 pull 失敗になる）。Actions から build-images を workflow_dispatch で実行してから再デプロイしてください。"
            exit 1
          fi
          echo "IMAGE_TAG=sha-$SHA" >> "$GITHUB_ENV"
          echo "resolved IMAGE_TAG=sha-$SHA (build-images head SHA)"

      - name: Provision + deploy (up)
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        env:
          # push（自動デプロイ）には inputs が無いので既定 cpu。tier を変えたいときは手動 up。
          VOICEVOX_TIER: ${{ github.event.inputs.voicevox || 'cpu' }}
        run: |
          RG="$RG" ENVIRONMENT="$ENVIRONMENT" DEPLOYMENT="$DEPLOYMENT" VOICEVOX_TIER="$VOICEVOX_TIER" \
            IMAGE_TAG="$IMAGE_TAG" \
            ./cicd/scripts/deploy/provision.sh

      # デプロイのたびに「意図した接続が通り、それ以外が拒否される」ことを実測する。
      # 無いと何が静かに通るか: 認可が外れても (EasyAuth の設定ミス・Container Apps の
      # ingress 制限が再デプロイで剥がれる 等) デプロイは緑のままで、誰も気づかない。
      # 実際 2026-08-06〜07 に「認証無効ビルドの出荷」「コンテナの無認可公開」
      # 「IP 制限の剥がれ」が起き、いずれも偶然の点検でしか見つからなかった。
      # EXPECTED_IMAGE_TAG: 稼働 revision の image タグが「今回解決した sha」と一致するかを
      # smoke-test 側で検証する (#107 再発検知)。update が no-op に戻るとここが NG で赤くなる。
      - name: Smoke test（認可と疎通の実測）
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: |
          RG="$RG" DEPLOYMENT="$DEPLOYMENT" EXPECTED_IMAGE_TAG="$IMAGE_TAG" \
            ./cicd/scripts/smoke-test/smoke-test.sh

      # 無いと何が静かに通るか: 認可・疎通が緑でも「相談ユースケースそのもの」は別物。
      # 2026-08-07〜08 に空 concern 拒否 / :latest no-op / BFF→CA 403 / TTS 断線が
      # いずれも smoke 緑のまま発生した (#108)。ここで認証込みの実トークンで
      # 対話 (実 AI) と音声合成まで通しで実測する。
      - name: Golden path（相談ユースケースの実測・実 AI）
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: |
          RG="$RG" DEPLOYMENT="$DEPLOYMENT" ./cicd/scripts/smoke-test/golden-path.sh

      # UI 込みのシナリオテスト (L4 live E2E)。curl 版 golden-path.sh は API ホップの
      # 切り分け用。ここでは**デプロイ済みの実 SWA バンドル**を Playwright で操作し、
      # VITE_* 焼き込みミス・実オリジン CORS・フロント↔BFF の結線破壊 (TTS のオリジン
      # 違い等, 2026-08-08 実事象) まで検知する。ログイン経路のカナリア込み。
      - name: Golden path scenario（UI 込み E2E・実環境）
        id: e2e
        if: steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: |
          OUTPUTS="$(az deployment group show -g "$RG" -n "$DEPLOYMENT" --query 'properties.outputs' -o json)"
          _val() { echo "$OUTPUTS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$1',{}).get('value',''))"; }
          export LIVE_APP_URL="https://$(_val staticSiteDefaultHostname)"
          export LIVE_BFF_URL="https://$(_val functionAppDefaultHostname)"
          export LIVE_ENTRA_CLIENT_ID="$(_val functionAuthEntraClientId)"
          export LIVE_ENTRA_TENANT_ID="$(_val functionAuthEntraTenantId)"
          export LIVE_BFF_TOKEN="$(az account get-access-token --scope "api://$LIVE_ENTRA_CLIENT_ID/.default" --query accessToken -o tsv)"
          # 実トークンをログ・trace への漏出から守る (レビュー指摘)
          echo "::add-mask::$LIVE_BFF_TOKEN"
          cd apps/frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e:live

      # E2E が落ちたとき、runner 上には Playwright の証拠 (スクリーンショット /
      # error-context / trace) が出るが、これまで**どこにも上げていなかった**ため
      # runner ごと消えていた。結果として過去の実環境 E2E 失敗はどれも事後に
      # 診断できず、#293 は丸一日「SSE がハングする」という仮説のまま動けなかった。
      #
      # ⚠️ **trace.zip は上げない。** e2e-live/entra-login.ts が偽装トークン
      # エンドポイントの応答として **実 BFF アクセストークン (LIVE_BFF_TOKEN) を
      # ブラウザへ注入**しており、trace はネットワークのやり取りを丸ごと記録する。
      # 上の `::add-mask::` は Actions のログにしか効かないので、trace を artifact に
      # すると**生きた Azure アクセストークンを配布する**ことになる。
      # 上げるのはスクリーンショット (画像) と error-context.md (aria スナップショット)
      # だけ — どちらもトークンを載せる経路が無く、「画面がどうなっていたか」という
      # 診断に必要な情報はここに入っている。
      - name: E2E の失敗証拠を残す（trace は実トークンを含むため除外）
        if: always() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-live-failure-${{ github.run_id }}
          path: |
            apps/frontend/test-results-live/**/*.png
            apps/frontend/test-results-live/**/error-context.md
          retention-days: 14
          if-no-files-found: warn

      # trace は診断価値が最も高いが、実 BFF アクセストークンを含む (上のステップの
      # コメント参照)。**public リポジトリなので artifact のアクセス制限は使えない**
      # ため、公開鍵で暗号化してから上げる (ADR 0045)。
      #
      # スクラブ (文字列置換) を選ばなかった理由: 秘密は trace 内の 3 種類のエントリ
      # (spec のソース / アクション記録 / DOM スナップショット) に散らばっており、
      # 外科的な除去は列挙漏れで**静かに漏れる** (失敗が公開側に倒れる)。暗号化は
      # 中身の形に依存しないので、その失敗モードが存在しない。
      #
      # 鍵の準備・復号手順は cicd/keys/README.md。
      - name: E2E の trace を公開鍵で暗号化して残す
        id: encrypt_trace
        if: always() && steps.e2e.conclusion == 'failure'
        env:
          PUBKEY: cicd/keys/e2e-artifacts.pub.asc
        run: |
          cicd/scripts/deploy/encrypt-e2e-traces.sh \
            "$PUBKEY" apps/frontend/test-results-live e2e-trace-enc

      # **暗号化ステップの成功を必須にする。** hashFiles だけで判定すると、途中で
      # 暗号化が失敗した run でも「.gpg が 1 つでもあれば」部分成果物が上がる
      # (Codex P1 / PR #300)。outcome を条件に入れて fail closed にする。
      - name: 暗号化した trace をアップロードする
        if: always() && steps.e2e.conclusion == 'failure' && steps.encrypt_trace.outcome == 'success' && hashFiles('e2e-trace-enc/**/*.gpg') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-live-trace-${{ github.run_id }}
          path: e2e-trace-enc/**/*.gpg
          retention-days: 14
          if-no-files-found: error

      - name: SWA URL を Actions サマリに出す
        # smoke が落ちても URL は出す（切り分けの手掛かりになるため）。
        if: always() && steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true'))
        run: |
          HOST="$(az staticwebapp list -g "$RG" --query "[?starts_with(name, 'swa-')].defaultHostname | [0]" -o tsv 2>/dev/null || true)"
          if [ -n "$HOST" ]; then
            {
              echo "### 🌐 公開 URL（常設 dev / スマホからアクセス）"
              echo ""
              echo "https://$HOST"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SWA の defaultHostname を取得できませんでした。deploy-frontend のログを参照してください。"
          fi

      # 落ちたことに気づける唯一の経路。別の見張りを置かず、落ちた当人が Issue を立てる
      # (ADR 0035 D2)。緑になれば同じ Issue を自分で閉じるので、Issue 一覧が現在の状態を表す。
      - name: 失敗を Issue にする / 復旧したら閉じる
        if: always()
        uses: ./.github/actions/report-failure
        with:
          job-status: ${{ job.status }}
          # 他のデプロイ系ステップと同じ条件。guard で skip / `down` 実行のときは
          # 「デプロイが通った」とは言えないので Issue を閉じない
          work-ran: ${{ steps.guard.outputs.run == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up') || (github.event_name == 'push' && steps.autodeploy.outputs.run == 'true')) }}
          what: "**dev への自動デプロイが失敗しました。** 実環境が古いまま、あるいは壊れた状態で止まっている可能性があります。"
