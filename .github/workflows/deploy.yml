name: deploy

# オンデマンド CD（ADR 0009）。
# - 手動 up: 環境を立ち上げる（IaC + コンテナ + BFF/frontend）
# - 手動 down: cleanup-env.sh で撤収（¥0 に戻す）
# - 夜間 schedule: 消し忘れ防止の自動 teardown ガード
#
# 認証は Azure OIDC（federated credential）= 保存シークレット0。
# 事前設定（一度きり）: docs/runbooks/azure-oidc-cd-setup.md を参照し、
# リポジトリ Variables に AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID を設定する。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = 立ち上げ / down = 撤収(¥0化)"
        type: choice
        options: [up, down]
        required: true
      environment:
        description: 対象環境
        type: choice
        options: [dev]
        default: dev
        required: true
  schedule:
    # 夜間 teardown ガード: 毎日 JST 04:07 (= UTC 19:07) に down。消し忘れでも ¥0 に戻る。
    # 立ち上げは常に手動 up なので、この自動 down で困らない（必要なら再度 up）。
    - cron: "7 19 * * *"

permissions:
  id-token: write # OIDC トークン取得に必須
  contents: read

concurrency:
  # up / down / schedule を RG 単位で「同一グループ」に入れて直列化する。
  # これは意図的: 別グループにすると手動 up と夜間 down が並列実行され、deployment 中に
  # group delete が走って RG が壊れる（= per-action グループ案より危険）。直列化が安全側。
  # 「立てた直後に夜間 teardown で消える」問題は、teardown ステップ側の最小生存時間ガード
  # （RG タグ deployedAtEpoch を見て若い環境は schedule では skip）で防ぐ。
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 初回 up は ~20〜40 分（IaC + az acr build）。acr build 再試行やネット遅延の余裕を見て 90。
    timeout-minutes: 90
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RG: rg-${{ github.event.inputs.environment || 'dev' }}-mind-inbox
      DEPLOYMENT: main-bootstrap
    steps:
      - uses: actions/checkout@v4

      # OIDC 未設定（repo Variables 未登録）の間は、誤実行や夜間 schedule を赤くせず skip。
      - name: Guard — OIDC 設定済みか
        id: guard
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # 3 変数すべて揃って初めて run=true。partial 登録を後段 azure/login まで持ち越さない。
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OIDC 未設定（AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID のいずれか空）。docs/runbooks/azure-oidc-cd-setup.md で3変数すべてを Variables に登録してください。今回はスキップします。"
          fi

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.run == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---- DOWN: 手動 down または 夜間 schedule ----
      # cleanup-env.sh は冪等（内部 rg_exists ガードで RG 不在なら group delete を skip）。
      # よって既に撤収済みの夜でもジョブは緑のまま。`|| true` は付けない（purge 失敗等の
      # 本当のエラーは赤くして気づきたいため）。
      # 夜間 schedule のみ「最小生存時間」ガード: 立てたばかり(< MIN_LIFETIME_SECONDS)の環境は
      # 即撤収しない（手動 down は明示意図なので常に実行）。
      - name: Tear down (cleanup-env)
        if: steps.guard.outputs.run == 'true' && (github.event_name == 'schedule' || github.event.inputs.action == 'down')
        env:
          MIN_LIFETIME_SECONDS: "10800" # 3h
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DEPLOYED_AT="$(az group show -n "$RG" --query "tags.deployedAtEpoch" -o tsv 2>/dev/null || true)"
            if [ -n "$DEPLOYED_AT" ]; then
              AGE=$(( $(date +%s) - DEPLOYED_AT ))
              if [ "$AGE" -lt "$MIN_LIFETIME_SECONDS" ]; then
                echo "環境が新しい（${AGE}s < ${MIN_LIFETIME_SECONDS}s）ため夜間 teardown を skip。"
                exit 0
              fi
            fi
          fi
          echo "Tearing down $RG ..."
          RG="$RG" ./cicd/scripts/env/cleanup-env.sh

      # ---- UP: 手動 up のみ ----
      - name: Setup Node 22
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deploy tooling (swa CLI, zip)
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'
        run: |
          npm install -g @azure/static-web-apps-cli
          # zip は ubuntu-latest に入っている想定。無い時だけ apt（毎回の update ~30-60s を回避）。
          command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }

      - name: Provision + deploy (up)
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'
        run: |
          RG="$RG" ENVIRONMENT="$ENVIRONMENT" DEPLOYMENT="$DEPLOYMENT" \
            ./cicd/scripts/deploy/provision.sh

      - name: SWA URL を Actions サマリに出す
        if: steps.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'up'
        run: |
          HOST="$(az staticwebapp list -g "$RG" --query "[?starts_with(name, 'swa-')].defaultHostname | [0]" -o tsv 2>/dev/null || true)"
          if [ -n "$HOST" ]; then
            {
              echo "### 🌐 公開 URL（スマホからアクセス）"
              echo ""
              echo "https://$HOST"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SWA の defaultHostname を取得できませんでした。deploy-frontend のログを参照してください。"
          fi
