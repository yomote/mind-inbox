# サンドボックスの外にある「事実」をエージェントが自力で取るための read-only ワークフロー。
# 判断の根拠: ADR 0031 (docs/adr/0031-agent-reaches-outside-via-github-actions.md)
#
# なぜ必要か:
#   エージェントのセッションは (1) egress ポリシーで一部ドメインに届かず
#   (2) Azure のトークンを持てない (ADR 0006)。runner は両方の制約が無く、
#   エージェントは GitHub MCP で起動 (actions_run_trigger) と結果取得
#   (get_job_logs) ができる。
#
# 使い方 (エージェント):
#   actions_run_trigger { method: run_workflow, workflow_id: "ops-inspect.yml",
#                         ref: "main", inputs: { check: "cosmos-free-tier" } }
#   → actions_list (list_workflow_jobs) で job_id を取り、get_job_logs で読む
#   運用手順は docs/runbooks/ops-inspect.md
#
# 🔒 セキュリティ上の約束 (ADR 0031 D2 — 妥協しないこと):
#   - **自由入力のコマンドを受け取らない**。操作は choice の固定値だけ。
#     デプロイ用 SP はサブスクリプション Contributor のままなので (#46)、
#     任意コマンドを受ける口を作ると、この迂回路自体がリポジトリで最も強い
#     書き込み経路になる。
#   - **入力をシェルに展開しない**。`run:` の中に ${{ inputs.* }} を直接書かず、
#     必ず env: 経由で渡して "$VAR" として引用符付きで参照する
#     (${{ }} は run の実行前にテキスト置換されるため、直接書くと注入口になる)。
#   - **状態を変える操作をしない**。az は show / list のみ、curl は GET のみ。
#     **例外は 1 つだけ** — Cost Management の query API
#     (`az rest --method post .../Microsoft.CostManagement/query`) は POST だが読み取り。
#     この API は集計条件 (期間・粒度・グルーピング) を body で渡す設計のため
#     メソッドが POST になるだけで、**サブスクリプションの状態は何も変えない**
#     (GET の `az consumption usage list` は pretaxCost が "None" で返り実額が取れない
#     — 2026-08-10 実測。cost-summary の中のコメント参照)。
#     **例外はこの URI に閉じる。他の POST / PUT / PATCH / DELETE は書かない。**
#     広げるときは ADR 0048 の受容条件 2 を先に改訂すること
#     (docs/adr/0048-readonly-investigation-identity-on-unprotected-branch.md)。
#   - **取得できなかったことを「異常なし」と書かない** (inspect-env.sh と同じ規律)。
#     失敗は `(未検証: 理由)` として出す。

name: ops-inspect

on:
  workflow_dispatch:
    inputs:
      check:
        description: "何を調べるか"
        required: true
        type: choice
        options:
          - azure-resources
          - cosmos-free-tier
          - recent-errors
          - cost-summary
          - fetch-doc
      url:
        description: "fetch-doc のときだけ使う取得先 URL (https のみ)"
        required: false
        type: string
        default: ""
      environment:
        description: "対象環境 (azure-resources のリソースグループ解決に使う)"
        required: false
        type: choice
        options:
          - dev
          - stg
          - prod
        default: dev

# 最小権限。issues / pull-requests は付けない (このワークフローは書き込まない)。
permissions:
  contents: read
  id-token: write # OIDC トークン取得に必須

jobs:
  inspect:
    name: inspect (${{ inputs.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Azure を触る check だけ OIDC が要る。fetch-doc は不要。
      #
      # 2026-08-10 (#209): main 限定の OIDC しか無かったため、**Azure を読むクエリを 1 行
      # 直すたびに main へマージが必要**だった (この日だけで 6 往復)。読むだけの確認に
      # 書き込みブランチを経由していた。そこで read-only 専用の ID を足し、
      # **main 以外はそちらでログインする**。
      #   - main            → 従来のデプロイ SP (AZURE_CLIENT_ID)
      #   - それ以外のブランチ → read-only ID (AZURE_CLIENT_ID_RO)
      # read-only ID のフェデレーション資格情報は `ops/inspect` ブランチに紐づけている
      # (ワイルドカードは使えないため専用ブランチに寄せた / Runbook: azure-oidc-cd-setup.md)。
      - name: Guard — OIDC 設定済みか
        id: guard
        env:
          CHECK: ${{ inputs.check }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_ID_RO: ${{ vars.AZURE_CLIENT_ID_RO }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$CHECK" = "fetch-doc" ]; then
            echo "needs_azure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_azure=true" >> "$GITHUB_OUTPUT"

          if [ "$REF_NAME" = "main" ]; then
            CID="$AZURE_CLIENT_ID"
            WHICH="デプロイ SP (main)"
            HINT="docs/runbooks/azure-oidc-cd-setup.md"
          else
            CID="$AZURE_CLIENT_ID_RO"
            WHICH="read-only ID ($REF_NAME)"
            HINT="Issue #209 — AZURE_CLIENT_ID_RO の登録と ops/inspect 向け資格情報が要る"
          fi
          echo "which=$WHICH" >> "$GITHUB_OUTPUT"
          echo "client_id=$CID" >> "$GITHUB_OUTPUT"

          # deploy.yml と同じ規律: 3 つ揃って初めて true。partial を後段へ持ち越さない。
          if [ -n "$CID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ログインに使う識別: $WHICH"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OIDC 未設定のため Azure に接続しない ($WHICH)。$HINT"
          fi

      - name: Azure login (OIDC, no stored secret)
        if: steps.guard.outputs.needs_azure == 'true' && steps.guard.outputs.run == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ steps.guard.outputs.client_id }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect
        id: inspect
        env:
          # ⚠️ 入力はここで env に閉じ込める。run: の中に ${{ inputs.* }} を書かない。
          CHECK: ${{ inputs.check }}
          URL_INPUT: ${{ inputs.url }}
          ENV_NAME: ${{ inputs.environment }}
          AZURE_READY: ${{ steps.guard.outputs.run }}
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          set -uo pipefail   # -e は付けない。取得失敗を「未検証」として出したいため。

          OUT=/tmp/ops-inspect.md
          STATUS="ok"
          NOTE=""
          : > "$OUT"

          fail() {  # fail "<理由>"
            STATUS="unverified"
            NOTE="$1"
            printf '\n> ⚠️ **(未検証: %s)**\n' "$1" >> "$OUT"
          }

          case "$CHECK" in
            azure-resources)
              echo "## Azure リソース一覧 (env: $ENV_NAME)" >> "$OUT"
              if [ "$AZURE_READY" != "true" ]; then
                fail "OIDC 未設定のため Azure に接続していない"
              else
                RG="rg-${ENV_NAME}-mind-inbox"
                echo "" >> "$OUT"
                echo "リソースグループ: \`$RG\`" >> "$OUT"
                echo '```' >> "$OUT"
                if ! az resource list --resource-group "$RG" \
                      --query "sort_by([].{name:name,type:type,location:location}, &type)" \
                      -o table >> "$OUT" 2>/tmp/err.txt; then
                  cat /tmp/err.txt >> "$OUT"
                  echo '```' >> "$OUT"
                  fail "az resource list が失敗した ($RG が存在しない可能性)"
                else
                  echo '```' >> "$OUT"
                  # inspect-env.sh は「人が読む詳細ダンプ」。あれば併せて流す (ADR 0018 ①)。
                  if [ -x cicd/scripts/smoke-test/inspect-env.sh ]; then
                    echo "" >> "$OUT"
                    echo "<details><summary>inspect-env.sh の詳細ダンプ</summary>" >> "$OUT"
                    echo "" >> "$OUT"
                    RG="$RG" DEPLOYMENT=main-bootstrap \
                      cicd/scripts/smoke-test/inspect-env.sh >> "$OUT" 2>&1 \
                      || echo "(inspect-env.sh は失敗しました。上の一覧のみ有効です)" >> "$OUT"
                    echo "" >> "$OUT"
                    echo "</details>" >> "$OUT"
                  fi
                fi
              fi
              ;;

            cosmos-free-tier)
              # ADR 0030 D2 の宿題: free tier は「1 サブスクリプションに 1 アカウント」
              # かつ「アカウント作成時のオプトイン必須」。既存アカウントの有無で判定する。
              echo "## Cosmos DB の free tier がこのサブスクリプションで使えるか" >> "$OUT"
              if [ "$AZURE_READY" != "true" ]; then
                fail "OIDC 未設定のため Azure に接続していない"
              else
                LIST=$(az cosmosdb list \
                        --query "[].{name:name,rg:resourceGroup,location:location,freeTier:enableFreeTier}" \
                        -o json 2>/tmp/err.txt)
                if [ $? -ne 0 ]; then
                  echo '```' >> "$OUT"; cat /tmp/err.txt >> "$OUT"; echo '```' >> "$OUT"
                  fail "az cosmosdb list が失敗した"
                else
                  COUNT=$(echo "$LIST" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
                  USED=$(echo "$LIST" | python3 -c 'import json,sys; print(sum(1 for a in json.load(sys.stdin) if a.get("freeTier")))')
                  echo "" >> "$OUT"
                  echo "- 既存の Cosmos アカウント数: **$COUNT**" >> "$OUT"
                  echo "- うち free tier を使用中: **$USED**" >> "$OUT"
                  echo "" >> "$OUT"
                  if [ "$USED" -eq 0 ]; then
                    echo "→ ✅ **free tier はまだ消費されていない。新規アカウント作成時にオプトインすれば取得できる見込み。**" >> "$OUT"
                  else
                    echo "→ ❌ **free tier は既に別アカウントが消費している。ADR 0030 D2 のフォールバック (serverless) を採る。**" >> "$OUT"
                  fi
                  echo "" >> "$OUT"
                  echo '```json' >> "$OUT"; echo "$LIST" >> "$OUT"; echo '```' >> "$OUT"
                  echo "" >> "$OUT"
                  echo "> 注: これは「枠が空いているか」の判定であり、**無料枠の RU/s と GB の実額は含まない**。" >> "$OUT"
                  echo "> 実額はアカウント作成時の Portal 表示か \`az cosmosdb create\` の結果で確認すること。" >> "$OUT"
                fi
              fi
              ;;

            recent-errors)
              # 2026-08-10: 実環境で `consultation.extract` が 500 (upstream-failed) を
              # 返したが、**例外の中身がどこにも出てこなかった**。BFF は種別トークンだけ
              # 残して詳細を捨て、ai-agent の例外は Container App の中にある。
              # 「壊れているのは分かるが、なぜかが分からない」を潰すための read-only 経路。
              echo "## 直近のエラーログ (BFF / ai-agent)" >> "$OUT"
              if [ "$AZURE_READY" != "true" ]; then
                fail "OIDC 未設定のため Azure に接続していない"
              else
                RG="rg-${ENV_NAME}-mind-inbox"
                echo "" >> "$OUT"
                echo "対象リソースグループ: \`$RG\` / 直近 60 分" >> "$OUT"

                # --- ai-agent (Container Apps のシステムログ) ---
                echo "" >> "$OUT"
                echo "### ai-agent (Container App / 生きている replica のみ)" >> "$OUT"
                echo "" >> "$OUT"
                echo "> ⚠️ scale-to-zero のため、**失敗した当時の replica はもう存在しない**ことが多い。" >> "$OUT"
                echo "> 過去の障害を追うときは下の「保存されたログ」を見ること。" >> "$OUT"
                CA=$(az containerapp list -g "$RG" --query "[?contains(name,'ai-agent')].name | [0]" -o tsv 2>/tmp/err.txt)
                if [ -z "$CA" ]; then
                  echo '```' >> "$OUT"; cat /tmp/err.txt >> "$OUT"; echo '```' >> "$OUT"
                  fail "ai-agent の Container App が見つからない"
                else
                  echo '```' >> "$OUT"
                  if ! az containerapp logs show -g "$RG" -n "$CA" --tail 80 --type console \
                        >> "$OUT" 2>/tmp/err.txt; then
                    cat /tmp/err.txt >> "$OUT"
                    echo '```' >> "$OUT"
                    fail "az containerapp logs show が失敗した"
                  else
                    echo '```' >> "$OUT"
                  fi
                fi

                # --- 保存されたログ (Log Analytics) ---
                # ライブ tail は replica が消えると同時に消えるので、**過去の障害はここでしか追えない**。
                # テーブル名は構成で変わる (Container Apps / Functions / App Insights で別) ため、
                # 決め打ちせず**存在するものを探してから**引く。前回 `traces` を決め打ちして空振りした。
                echo "" >> "$OUT"
                echo "### 保存されたログ (Log Analytics)" >> "$OUT"
                WSNAME=$(az monitor log-analytics workspace list -g "$RG" --query "[0].name" -o tsv 2>/dev/null)
                WSID=$(az monitor log-analytics workspace list -g "$RG" --query "[0].customerId" -o tsv 2>/dev/null)
                if [ -z "$WSID" ]; then
                  echo "(未検証: Log Analytics ワークスペースが見つからない)" >> "$OUT"
                else
                  ALL=$(az monitor log-analytics workspace table list -g "$RG" \
                          --workspace-name "$WSNAME" --query "[].name" -o tsv 2>/dev/null)
                  echo "" >> "$OUT"
                  echo "<details><summary>このワークスペースにあるテーブル</summary>" >> "$OUT"
                  echo "" >> "$OUT"; echo '```' >> "$OUT"
                  echo "$ALL" | tr ' ' '\n' | sort >> "$OUT"
                  echo '```' >> "$OUT"; echo "</details>" >> "$OUT"

                  # `take` は**任意の N 行**であって最新ではない。しかも絞り込まないと
                  # 行数の多い voicevox のログで埋まる (初回はそれで規約テキストが 40 行出た)。
                  # 列名も環境で変わるので推測しない — `where * has` で全列を対象に絞る。
                  # $CA が取れていないと `ContainerAppName_s == ''` が全除外になり、
                  # 「エラー無し」に見えてしまう。取れていないことを明示して絞り込みを外す。
                  if [ -z "${CA:-}" ]; then
                    echo "" >> "$OUT"
                    echo "> ⚠️ ai-agent の Container App 名を解決できなかったため、アプリでの絞り込みをしていない。" >> "$OUT"
                    CA_FILTER_CL=""
                    CA_FILTER=""
                  else
                    CA_FILTER_CL="| where ContainerAppName_s == '$CA'"
                    CA_FILTER="| where ContainerAppName == '$CA'"
                  fi
                  FOUND=0
                  for T in ContainerAppConsoleLogs_CL ContainerAppConsoleLogs AppTraces AppExceptions FunctionAppLogs; do
                    echo "$ALL" | tr ' ' '\n' | grep -qx "$T" || continue
                    FOUND=1
                    # 列名は 2026-08-10 の run で getschema を実際に出して確定させた。
                    # **テーブルごとに列名が違う** — _CL 版は `Log_s` / `ContainerName_s`、
                    # 素の版は `Log` / `ContainerName`、AppTraces に `Level` は無く
                    # `SeverityLevel` (int)。ここを共通化しようとして 2 回空振りした。
                    case "$T" in
                      ContainerAppConsoleLogs_CL)
                        # ai-agent の Container App だけに絞る。voicevox は起動のたびに
                        # 数百行の規約テキストを吐き、200 行の窓を丸ごと食い潰す。
                        Q="$T | where TimeGenerated > ago(4h) $CA_FILTER_CL | where ContainerName_s != 'http-auth' | top 200 by TimeGenerated desc | project TimeGenerated, ContainerName_s, Log_s"
                        ;;
                      ContainerAppConsoleLogs)
                        Q="$T | where TimeGenerated > ago(4h) $CA_FILTER | where ContainerName != 'http-auth' | top 200 by TimeGenerated desc | project TimeGenerated, ContainerName, Log"
                        ;;
                      AppExceptions)
                        Q="$T | where TimeGenerated > ago(4h) | top 40 by TimeGenerated desc | project TimeGenerated, AppRoleName, ExceptionType, Message, OperationName"
                        ;;
                      AppTraces)
                        # SeverityLevel: 0=Verbose 1=Info 2=Warning 3=Error 4=Critical
                        Q="$T | where TimeGenerated > ago(4h) | where SeverityLevel >= 3 | top 40 by TimeGenerated desc | project TimeGenerated, AppRoleName, SeverityLevel, Message"
                        ;;
                      *)
                        Q="$T | where TimeGenerated > ago(4h) | where Level in ('Error','Critical') or isnotempty(ExceptionMessage) | top 40 by TimeGenerated desc | project TimeGenerated, Level, ExceptionType, ExceptionMessage, ExceptionDetails"
                        ;;
                    esac
                    echo "" >> "$OUT"
                    echo "#### $T (直近 4 時間・新しい順)" >> "$OUT"
                    echo '```' >> "$OUT"
                    if ! az monitor log-analytics query -w "$WSID" --analytics-query "$Q" \
                          -o table >> "$OUT" 2>/tmp/err.txt; then
                      cat /tmp/err.txt >> "$OUT"
                      echo '```' >> "$OUT"
                      # クエリが通らなかったときだけ列名を出す。毎回出すと schema ダンプが
                      # 出力の大半を占めて、肝心のログが読めない (前回それで埋まった)。
                      echo "" >> "$OUT"
                      echo "<details><summary>$T の列名 (クエリが失敗したので参考に出す)</summary>" >> "$OUT"
                      echo "" >> "$OUT"; echo '```' >> "$OUT"
                      az monitor log-analytics query -w "$WSID" \
                        --analytics-query "$T | getschema | project ColumnName, ColumnType" \
                        -o table >> "$OUT" 2>&1
                      echo '```' >> "$OUT"; echo "</details>" >> "$OUT"
                      fail "$T のクエリが失敗した (列名は上の details を見ること)"
                    else
                      echo '```' >> "$OUT"
                    fi
                  done
                  if [ "$FOUND" = "0" ]; then
                    echo "" >> "$OUT"
                    fail "既知のログテーブルがどれも存在しない (上の一覧から選び直すこと)"
                  fi
                fi
              fi
              ;;

            cost-summary)
              echo "## 当月の実コスト (予算 ¥3,000 に対して)" >> "$OUT"
              if [ "$AZURE_READY" != "true" ]; then
                fail "OIDC 未設定のため Azure に接続していない"
              else
                # 2026-08-10: 当初 `az consumption usage list` を使っていたが、このサブスクリプ
                # ションでは **pretaxCost が文字列 "None" で返る** (89 件すべて)。金額が取れて
                # いないのに合計 0.00 と表示され、「0 円」と誤読しかけた。権限の問題ではなく
                # (Cost Management Reader を付けても変わらない) API の選択ミスだった。
                # Cost Management の query API は同じ資格情報で実額を返す。
                cat > /tmp/costq.json <<'JSON'
          {
            "type": "ActualCost",
            "timeframe": "MonthToDate",
            "dataset": {
              "granularity": "None",
              "aggregation": { "totalCost": { "name": "Cost", "function": "Sum" } },
              "grouping": [ { "type": "Dimension", "name": "ResourceId" } ]
            }
          }
          JSON
                SUB=$(az account show --query id -o tsv 2>/dev/null)
                URI="https://management.azure.com/subscriptions/$SUB/providers/Microsoft.CostManagement/query?api-version=2023-03-01"

                # この API は 429 を返しやすい。リトライして、それでも駄目なら未検証で落とす。
                RESP=""
                for i in 1 2 3; do
                  RESP=$(az rest --method post --uri "$URI" --body @/tmp/costq.json -o json 2>/tmp/err.txt)
                  case "$RESP" in *'"rows"'*) break ;; esac
                  sleep 20
                done

                if ! printf '%s' "$RESP" | grep -q '"rows"'; then
                  echo '```' >> "$OUT"; head -c 500 /tmp/err.txt >> "$OUT"; echo '```' >> "$OUT"
                  fail "Cost Management query が失敗した (429 か権限不足。Cost Management Reader が要る)"
                else
                  # 応答は **ファイル経由**で渡し、集計の成否を必ず bash 側で受け取る。
                  # `python3 - "$OUT" <<'PY'` は stdin をプログラムに占有させるので、
                  # パイプで渡したつもりの応答は届かず json.load(sys.stdin) が EOF を
                  # 読んで必ず落ちる。このスクリプトは (意図的に) set -e を使わないため、
                  # 落ちても STATUS は初期値 ok のまま残り、**コストを 1 円も取れて
                  # いないのに機械可読ブロックが "ok" を返す**。冒頭の規律
                  # 「取得できなかったことを『異常なし』と書かない」に正面から反する。
                  cat > /tmp/costsum.py <<'PY'
          import json, sys

          d = json.load(open(sys.argv[1]))
          out = open(sys.argv[2], "a")
          props = d.get("properties", {})
          cols = [c["name"] for c in props.get("columns", [])]
          rows = props.get("rows", [])
          if "Cost" not in cols or not rows:
              out.write("\n集計できませんでした: 返ってきた列 %s / 行数 %d\n" % (cols, len(rows)))
              print("NOKEY")
              raise SystemExit(0)

          ci = cols.index("Cost")
          ri = cols.index("ResourceId") if "ResourceId" in cols else None
          cur = rows[0][cols.index("Currency")] if "Currency" in cols else ""
          total = sum(float(r[ci] or 0) for r in rows)

          out.write("\n**合計 %.2f %s** (当月・ActualCost)\n\n" % (total, cur))
          out.write("| リソース | コスト |\n| --- | ---: |\n")
          for r in sorted(rows, key=lambda x: -float(x[ci] or 0))[:15]:
              name = str(r[ri]).rsplit("/", 1)[-1] if ri is not None else "?"
              out.write("| %s | %.2f |\n" % (name, float(r[ci] or 0)))
          print("OK %.2f" % total)
          PY
                  printf '%s' "$RESP" > /tmp/costresp.json
                  if ! SUMMARY=$(python3 /tmp/costsum.py /tmp/costresp.json "$OUT" 2>/tmp/costerr.txt); then
                    echo '```' >> "$OUT"; head -c 500 /tmp/costerr.txt >> "$OUT"; echo '```' >> "$OUT"
                    fail "コスト集計が異常終了した (上の details を見ること)"
                  else
                    case "$SUMMARY" in
                      NOKEY*) fail "コストを集計できなかった (Cost 列が無いか当月の行が 0 件 — 本文の列名を見ること)" ;;
                    esac
                  fi
                fi
              fi
              ;;

            fetch-doc)
              echo "## 取得したページ" >> "$OUT"
              # URL は env 経由でのみ参照する。シェル展開に載せない。
              case "$URL_INPUT" in
                https://*) : ;;
                *) fail "url が https:// で始まっていない (受け取った値は出力しない)"; URL_INPUT="" ;;
              esac
              if [ -n "$URL_INPUT" ]; then
                echo "" >> "$OUT"
                echo "URL: \`$URL_INPUT\`" >> "$OUT"
                echo "" >> "$OUT"
                echo '```' >> "$OUT"
                if ! curl -sSL --max-time 30 --max-filesize 5000000 \
                      -H 'User-Agent: mind-inbox-ops-inspect' \
                      --url "$URL_INPUT" \
                      | python3 -c 'import sys,re,html; t=sys.stdin.read(); t=re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>"," ",t); t=re.sub(r"(?s)<[^>]+>"," ",t); t=html.unescape(t); t=re.sub(r"[ \t]+"," ",t); t=re.sub(r"\n\s*\n+","\n\n",t); print(t[:60000])' \
                      >> "$OUT" 2>/tmp/err.txt; then
                  cat /tmp/err.txt >> "$OUT"
                  echo '```' >> "$OUT"
                  fail "取得または整形に失敗した"
                else
                  echo '```' >> "$OUT"
                fi
              fi
              ;;

            *)
              # choice 以外は届かない想定だが、届いたら明示的に落とす (黙って通さない)。
              echo "::error::未知の check: 固定の選択肢以外は受け付けない (ADR 0031 D2)"
              exit 2
              ;;
          esac

          # --- 出力 ---------------------------------------------------------
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT"   # get_job_logs で読めるよう、ログにも同じ内容を出す

          # 機械可読ブロック (ADR 0029 と同じ流儀。1 run = 1 ブロック)
          python3 - "$CHECK" "$STATUS" "$NOTE" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          check, status, note = sys.argv[1], sys.argv[2], sys.argv[3]
          print("```json")
          print(json.dumps({"kind": "ops-inspect-result", "check": check,
                            "status": status, "note": note}, ensure_ascii=False))
          print("```")
          PY
