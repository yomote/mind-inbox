# マージの門 (ADR 0036) — PR に required check `review-gate` (commit status) を貼る。
#
# 条件: PM 受け入れコメント ([pm-accept] + head SHA) / レビュースレッド全解決 /
#       (コード PR かつ vars.REVIEW_GATE_REQUIRE_CODEX=true なら) Codex レビュー。
# workflow run の緑 = 「評価できたこと」。判定の 🟢/🔴 は commit status 側に出る。
# 強制力はブランチ保護 (required status check) が持つ — 設定は needs-human Issue 参照。
#
# 付随 (ADR 0038 — advisory、合否には入れない):
#   - コード PR に Codex レビューが 10 分以上未着なら `@codex review` を 1 回だけ自動投稿
#   - 敏感パス (IaC / workflow / BFF の認証・トークン・CORS 関連等) に触れる PR には
#     `@codex security review` を 1 回だけ自動指名
#   冪等性はコメント本文のマーカーで機械判定 (2 重投稿しない)。判定は check.py の純関数。
#
# 注意: issue_comment / pull_request_review トリガーは main に入った版でしか発火しない。
#       コメント後の再評価が要るときは workflow_dispatch で PR 番号を渡して叩ける。

name: review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: "再評価する PR 番号"
        required: true

permissions:
  contents: read
  # write は advisory コメント (@codex review / @codex security review) の投稿用 (ADR 0038)
  pull-requests: write
  statuses: write

jobs:
  gate:
    name: マージの門を判定
    runs-on: ubuntu-latest
    # issue_comment は Issue にも飛ぶ — PR のコメントだけ拾う
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4

      - name: 判定して commit status を貼る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_GATE_REQUIRE_CODEX: ${{ vars.REVIEW_GATE_REQUIRE_CODEX }}
          # Codex 自動再トリガーの猶予 (分)。未設定なら既定 10 (ADR 0038)
          CODEX_RETRIGGER_MINUTES: ${{ vars.CODEX_RETRIGGER_MINUTES }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: python3 cicd/scripts/review-gate/check.py "$PR_NUMBER"
